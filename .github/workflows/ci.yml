name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml: a tag publishes only if the full
  # matrix passes, so there is one definition of "green".
  workflow_call:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # pywebview is deliberately NOT installed. It is optional at runtime and
      # needs GTK/Qt on Linux; the host, the SDK and the js_api shape test must
      # all import and pass without it. If that stops being true, CI says so
      # before a Linux user does.
      - name: Install runtime deps (no pywebview)
        run: pip install "flask>=3.0" "requests>=2.31" "waitress>=3.0"

      - name: Import the host without a GUI toolkit
        run: python -c "import run, hamdash, hamdash.app, hamdash.windows, hamdash.sdk; print(hamdash.__version__)"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  # The board's layout model, in the language it is written in. Node's own
  # test runner, so there is no package.json and nothing to install: the
  # thing being tested has no dependencies and neither should testing it.
  # One OS is enough - it is arithmetic over plain objects, not a browser.
  board:
    name: board layout (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Layout model tests
        run: node --test tests/js/
