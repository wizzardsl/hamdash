name: build

# Frozen desktop builds. Runs on demand, and as the middle stage of a release
# (release.yml calls this, then attaches what it produces).
#
# Windows, macOS and Linux. Windows and macOS have a pip-installable
# pywebview backend; Linux needs GTK's Python bindings, which pip does not
# provide, so the Linux job builds from a venv that can see the system's
# python3-gi and WebKit2GTK - and proves the window opens, because a build
# without them still passes the --browser smoke test while having no window.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-24.04
            label: linux-x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: "3.13"

      - name: Install
        if: runner.os != 'Linux'
        run: pip install -r requirements.txt pyinstaller

      # The system Python, because python3-gi is built for it: a
      # setup-python interpreter cannot import the distribution's gi.
      # libportaudio2 is what sounddevice loads, and PyInstaller bundles it
      # from here; xvfb is a screen for the window check below.
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi gir1.2-webkit2-4.1 \
            libportaudio2 xvfb
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements.txt pyinstaller
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build
        run: pyinstaller --noconfirm --clean hamdash.spec

      # A spec can build cleanly and still produce an app that cannot start a
      # single card: frozen, sys.executable is the binary rather than an
      # interpreter, so the re-exec path only ever runs in a real build. This
      # starts the app, proxies to a python card, and fails if it doesn't come
      # up - the one check that running from source can never make.
      - name: Smoke test the binary
        run: python tools/smoke_frozen.py

      # The one failure the step above cannot see: no GUI toolkit in the
      # bundle means no window, and the app then quietly carries on in the
      # browser. Starts it as a double-click would, on a virtual screen.
      - name: Smoke test the desktop window (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/smoke_frozen.py --window

      # macOS ships hamdash.app, not the bare folder: check it is one - the
      # version and icon inside, a signature that verifies (PyInstaller signs
      # ad hoc; an Apple Silicon Mac runs nothing unsigned) - then run the
      # program inside it through both smoke tests, window included.
      - name: The app (macOS)
        if: runner.os == 'macOS'
        env:
          HAMDASH_DIST: dist/hamdash.app/Contents/MacOS
        run: |
          test -x dist/hamdash.app/Contents/MacOS/hamdash
          test -f dist/hamdash.app/Contents/Resources/hamdash.icns
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/hamdash.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" dist/hamdash.app/Contents/Info.plist
          codesign --verify --deep --strict dist/hamdash.app && echo "signature verifies"
          python tools/smoke_frozen.py
          python tools/smoke_frozen.py --window

      # What a Mac user sees first, photographed.
      - name: Screenshot the app (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p shots mac-home
          HAMDASH_HOME="$PWD/mac-home" dist/hamdash.app/Contents/MacOS/hamdash --port 8790 &
          for i in $(seq 1 90); do
            s=$(curl -s http://127.0.0.1:8790/api/bus/stats || true)
            case "$s" in *'"subscribers":0'*|"") sleep 2 ;; *) break ;; esac
          done
          sleep 12
          screencapture -x shots/macos-first-run.png || echo "screencapture not allowed here"
          curl -s http://127.0.0.1:8790/api/shell; echo
          curl -s http://127.0.0.1:8790/api/health; echo
          python run.py --stop --home "$PWD/mac-home"

      # ditto, because the app is full of symlinks and execute bits that
      # upload-artifact drops - the reason 1.3.1's Mac download would not run.
      - name: Zip the app (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/hamdash.app dist/hamdash-${{ matrix.label }}.zip

      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'macOS'
        with:
          name: macos-shots
          path: shots/
          if-no-files-found: warn
          retention-days: 7

      # The installer, from the build above. Inno Setup is on the Windows
      # runner image; installed from Chocolatey if an image ever drops it.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $v = python -c "import hamdash; print(hamdash.__version__)"
          & $iscc /Qp "/DAppVersion=$v" installer\hamdash.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }

      # What an operator does, done silently: install, run it, install a
      # newer one over it, uninstall. An upgrade must clear stale files and
      # keep the settings; an uninstall must keep the settings too.
      - name: Test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\hamdash"
          $settings = "$env:APPDATA\hamdash"
          $quiet = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
          Start-Process dist\hamdash-setup.exe -ArgumentList ($quiet + '/LOG=install1.log') -Wait
          if (-not (Test-Path "$dir\hamdash.exe")) { throw "not installed at $dir" }
          $env:HAMDASH_DIST = $dir
          python tools/smoke_frozen.py
          if ($LASTEXITCODE) { throw "the installed copy failed the smoke test" }

          New-Item -ItemType Directory -Force $settings | Out-Null
          Set-Content "$settings\keep-me.txt" "settings survive"
          Set-Content "$dir\_internal\stale-from-old-version.txt" "should go"
          $left = Get-Process hamdash -ErrorAction SilentlyContinue
          if ($left) { $left | Format-Table Id, Path; throw "hamdash still running after the smoke test" }
          Start-Process dist\hamdash-setup.exe -ArgumentList ($quiet + '/LOG=install2.log') -Wait
          if (Test-Path "$dir\_internal\stale-from-old-version.txt") {
            Get-Content install2.log -Tail 40
            throw "upgrade left an old file behind"
          }
          if (-not (Test-Path "$dir\hamdash.exe")) { throw "upgrade removed the app" }
          if (-not (Test-Path "$settings\keep-me.txt")) { throw "upgrade touched the settings" }
          python tools/smoke_frozen.py
          if ($LASTEXITCODE) { throw "the upgraded copy failed the smoke test" }

          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\hamdash.exe") { throw "uninstall left the app" }
          if (-not (Test-Path "$settings\keep-me.txt")) { throw "uninstall removed the settings" }
          Write-Host "installed, upgraded and uninstalled; settings kept throughout"

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: hamdash-windows-x64-setup
          path: dist/hamdash-setup.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS'
        with:
          name: hamdash-${{ matrix.label }}
          path: dist/hamdash
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: hamdash-${{ matrix.label }}
          path: dist/hamdash-${{ matrix.label }}.zip
          if-no-files-found: error
          retention-days: 14
