# hamdash problem-report upload service. See SETUP.md and worker.js.
name = "hamdash-reports"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
REPO = "wizzardsl/hamdash-reports"

# A few reports a minute from one address is plenty for a person; the
# public URL must not be a way to fill the repository.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Daily, delete report zips older than KEEP_DAYS.
[triggers]
crons = ["17 4 * * *"]
