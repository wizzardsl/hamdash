<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  html, body { height: 100%; }
  body { padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }

  .bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  /* An author `display: flex` beats the user agent's `[hidden]`, so the
     filter bar stayed on screen on the Contests tab, filtering nothing. */
  .bar[hidden] { display: none; }
  .bar .spacer { flex: 1; }
  select, input, button { font: inherit; font-size: 12px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 2px 6px; }
  button { cursor: pointer; }
  button:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
  button[disabled] { opacity: .45; cursor: default; }
  #q { width: 9em; }

  /* The source chips are the filter and the legend at once: the colour
     beside a row is the one on its chip, so nothing has to be looked up. */
  .chip { display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
          border: 1px solid var(--rule); border-radius: var(--radius);
          padding: 2px 7px; user-select: none; }
  /* The source's shape, not a colour swatch: a row of identical dots asks
     the reader to hold a legend in their head. The colour still carries,
     through `currentColor`, so chip and row still match. */
  .chip .dot, .src { width: 13px; height: 13px; display: inline-flex;
                     align-items: center; justify-content: center; flex: none; }
  .chip .dot svg, .src svg { width: 100%; height: 100%; display: block; }
  .chip.off { opacity: .4; }
  /* An author `display` beats the user agent's `[hidden]`, so a chip
     hidden in code stays on screen without this. Third time. */
  .chip[hidden] { display: none; }
  .chip.off .dot { color: var(--muted) !important; }

  .tabs { display: flex; gap: 4px; }
  .tabs button.on { color: var(--accent); border-color: var(--accent); }
  .tabs .count { font-family: var(--mono); opacity: .8; }

  .scroll { flex: 1; min-height: 40px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px;
       position: sticky; top: 0; background: var(--panel); z-index: 1;
       padding: 2px 6px 3px; border-bottom: 1px solid var(--rule); }
  td { padding: 2px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tr:hover td { background: var(--panel-2); }
  .mono { font-family: var(--mono); }
  /* A mode read from a cluster spotter's comment rather than from a mode
     field. Said in the cell itself - italic and muted, with the reason on
     hover - because a mode that looks exactly like a known one is the
     wrong answer that looks like a right one. */
  td.guessed { font-style: italic; color: var(--muted); }

  .call { font-family: var(--mono); font-weight: 600; }
  .freq { font-family: var(--mono); }
  button.freq { border: none; background: none; padding: 0; color: var(--accent);
                text-decoration: underline dotted; }
  .dim { color: var(--muted); }
  .note { color: var(--muted); font-size: 11px; }
  .note.warn { color: var(--alert); }
  .ref { color: var(--muted); }

  /* Narrow: a phone, or a two-column tile on a crowded board. A card page
     is an iframe, so its own media queries measure the iframe rather than
     the screen - the same rule covers both without knowing which it is.

     The Where column is free text from somebody else's API ("Teganuma
     Shizen Fureai Greenway Prefectural ..."), and left to wrap it turned
     every row into five lines, so six spots filled the screen. One line
     each and the table scrolls sideways, which it already does. */
  @media (max-width: 520px) {
    td, th { white-space: nowrap; }
    td .ref { display: inline-block; max-width: 11em; overflow: hidden;
              text-overflow: ellipsis; vertical-align: bottom; }
  }
  .empty { padding: 14px 6px; color: var(--muted); font-size: 12px; }

  /* Contests. A running one is the answer to "why is the band full", so it
     is the loud part and what is merely coming up is quiet. */
  .con { border-bottom: 1px solid var(--rule); padding: 5px 6px; }
  .con .name { font-weight: 600; }
  .con.on .name { color: var(--accent); }
  /* An underline in --rule is invisible on this surface, which makes a
     link that nothing says is a link. Muted reads as "clickable" against
     both themes without competing with the contest name. */
  .con .name a { color: inherit; text-decoration: underline;
                 text-decoration-color: var(--muted);
                 text-underline-offset: 3px; }
  .con .name a:hover { text-decoration-color: currentColor; }
  /* A search is not the rules page. Dotted, so the difference is visible
     before the click rather than discovered after it. */
  .con .name a.guess { text-decoration-style: dotted; }
  .con .meta { color: var(--muted); font-size: 11px; }
  .credit { color: var(--muted); font-size: 11px; margin: 10px 6px 2px; }
  .credit a { color: var(--muted); }
  h4 { margin: 8px 6px 2px; font-size: 11px; color: var(--muted);
       text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>

<div class="bar">
  <span class="tabs">
    <button id="tab-spots" class="on" type="button">Spots <span class="count" id="n-spots"></span></button>
    <button id="tab-contests" type="button">Contests <span class="count" id="n-contests"></span></button>
  </span>
  <span class="spacer"></span>
  <span class="note" id="status"></span>
  <button id="refresh" type="button" title="Ask the sources now, if their floor allows it">Refresh</button>
</div>

<div class="bar" id="filters">
  <span class="chip" data-kind="pota"><span class="dot"></span>POTA</span>
  <span class="chip" data-kind="sota"><span class="dot"></span>SOTA</span>
  <span class="chip" data-kind="dx"><span class="dot"></span>Cluster</span>
  <span class="chip" data-kind="rbn" hidden><span class="dot"></span>RBN</span>
  <span class="chip" data-kind="cluster" hidden><span class="dot"></span>Telnet</span>
  <select id="band" aria-label="Band"><option value="">any band</option></select>
  <select id="mode" aria-label="Mode"><option value="">any mode</option></select>
  <input id="q" placeholder="call, park, summit" spellcheck="false" aria-label="Search">
  <button id="clear" type="button">Clear</button>
</div>

<div class="scroll" id="pane"></div>
<p class="note warn" id="err"></p>

<script src="/static/js/hamdash.js"></script>
<script>
HD.cardId = 'spots';
const $ = (s) => document.querySelector(s);

// One colour per source, used by the chip and by the dot on every row, so
// the filter bar is the legend and there is nothing else to learn.
const COLOUR = { pota: 'var(--signal)', sota: 'var(--accent)', dx: 'var(--ink)',
                 rbn: 'var(--alert)', cluster: 'var(--muted)' };

// A shape per source, because a row of identical coloured dots asks you to
// remember a legend. Drawn here rather than taken from POTA's or SOTA's
// logos: those are their marks, and a tree and a mountain say the same
// thing without borrowing anybody's branding.
//
// `currentColor` so the source colour still carries - the chip at the top
// is the legend and the row matches it, which is the rule this card was
// built on. 16x16 and no detail below a pixel: these are drawn at 13px.
const ICON = {
  // a conifer: Parks on the Air
  pota: '<path d="M8 1.2 4.1 7h1.7L2.6 11.4h4.2V15h2.4v-3.6h4.2L10.2 7h1.7z"/>',
  // two peaks: Summits on the Air
  sota: '<path d="M1 14 6 4.6l2.7 5 1.9-3.1L15 14z"/>',
  // somebody typed it: a cluster spot
  dx: '<path d="M2.4 2.6h11.2a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7.6l-3.4 3v-3H2.4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z"/>',
  // a machine heard it: skimmer spots
  rbn: '<g fill="none" stroke="currentColor" stroke-width="1.6" '
     + 'stroke-linecap="round"><path d="M3.6 10.6a5 5 0 0 1 8.8 0"/>'
     + '<path d="M1.2 13a8 8 0 0 1 13.6 0"/></g>'
     + '<circle cx="8" cy="5.2" r="1.7"/>',
};
ICON.cluster = ICON.dx;      // a telnet cluster spot is typed by a person too

function icon(kind) {
  const d = ICON[kind];
  if (!d) return '';
  return `<svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">${d}</svg>`;
}

const SOURCE_NAME = { pota: 'Parks on the Air', sota: 'Summits on the Air',
                      dx: 'DX cluster', cluster: 'DX cluster (telnet)',
                      rbn: 'Reverse Beacon Network' };

let conf = {};
let tab = 'spots';
let data = { spots: [], sources: [], now: 0 };
let cons = { on: [], soon: [], source: {} };
const off = new Set();          // sources switched off on this tile
let filters = { band: '', mode: '', q: '' };
// Where a mode came from when the source itself did not say. Both are shown
// italic and muted, filtered on, and never sent to the radio on a click.
const GUESSED = {
  comment: "From the spotter's comment - the cluster has no mode field",
  frequency: "From the frequency - FT8/FT4's usual spot; the spot gave no mode",
};

const esc = (v) => String(v ?? '').replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function hhmm(at) {
  const d = new Date(at * 1000);
  return `${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
}

function ago(seconds) {
  const s = Math.max(0, Math.round(seconds));
  if (s < 90) return `${s}s`;
  if (s < 5400) return `${Math.round(s / 60)}m`;
  return `${Math.round(s / 3600)}h`;
}

// ---- filtering, entirely over what was already fetched --------------------
// A keystroke must never be a reason to call somebody's server; the card
// holds the last fetch and the floor is in the card, not here.
function visible() {
  const q = filters.q.trim().toUpperCase();
  return data.spots.filter((s) => {
    if (off.has(s.kind)) return false;
    if (filters.band && s.band !== filters.band) return false;
    // A cluster spot carries no mode field. One whose comment names a mode
    // outright (`mode_from: 'comment'`), or that sits in FT8's or FT4's
    // window (`'frequency'`), has one and filters like any other; one that
    // has neither is kept, because hiding every unknown the moment a mode
    // was chosen reads as the cluster being down.
    if (filters.mode && s.mode && s.mode !== filters.mode) return false;
    if (filters.mode && !s.mode && s.kind !== 'dx') return false;
    if (!q) return true;
    return [s.call, s.ref, s.place, s.where, s.spotter, s.comment]
      .some((v) => String(v || '').toUpperCase().includes(q));
  });
}

function fillChoices() {
  const bands = [...new Set(data.spots.map((s) => s.band).filter(Boolean))];
  // By frequency, not alphabetically: 10m, 12m, 15m ... is nobody's idea of
  // band order. HD.bands() is the host's one table.
  const order = (HD._bandTable || []).map((b) => b[2]);
  bands.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  const modes = [...new Set(data.spots.map((s) => s.mode).filter(Boolean))].sort();
  for (const [el, list, label] of [[$('#band'), bands, 'any band'],
                                   [$('#mode'), modes, 'any mode']]) {
    const was = el.value;
    el.innerHTML = `<option value="">${label}</option>`
      + list.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    el.value = list.includes(was) ? was : '';
  }
}

// ---- drawing --------------------------------------------------------------
// What the Where column says. A park or summit when the source gives one,
// and the country when it does not - a skimmer spot carries neither, so the
// cell used to be a flag on its own and the country was only in a tooltip.
// Seeing where somebody is, is the whole job of this column.
function where(s) {
  const named = [s.place, s.where].filter(Boolean).join(' · ');
  return (named || s.country || '').slice(0, 44);
}

function paintSpots() {
  const rows = visible();
  $('#n-spots').textContent = rows.length ? `(${rows.length})` : '';
  if (!rows.length) {
    // An empty list has three different meanings and they are not
    // interchangeable: nothing has arrived yet, the filters exclude
    // everything, or - watching your own callsign on RBN - the feed is
    // busy and none of it is you. The last one is an answer, not a fault,
    // and it is the one that otherwise reads as the card being broken.
    const held = (data.sources || [])
      .filter((s) => s.held !== undefined && !off.has(s.name))
      .reduce((n, s) => n + s.held, 0);
    const live = (data.sources || []).some((s) => s.status === 'running');
    let why;
    if (data.watching && live && held) {
      why = `Nothing has heard <b>${esc(data.watching)}</b> yet — `
          + `${held} spots of other stations have come in.`;
    } else if (data.spots.length) {
      why = 'Nothing matches those filters.';
    } else if (live) {
      why = 'Listening…';
    } else {
      why = 'No spots yet — the sources are being asked.';
    }
    $('#pane').innerHTML = `<p class="empty">${why}</p>`;
    return;
  }
  const tune = conf.tune_on_click !== false;
  $('#pane').innerHTML = `<table><thead><tr>
      <th></th><th>UTC</th><th>Call</th><th>Freq</th><th>Band</th>
      <th>Mode</th><th>Where</th><th>Spotter</th><th>Comment</th>
    </tr></thead><tbody>${rows.map((s, i) => `<tr data-i="${i}">
      <td><span class="src" style="color:${COLOUR[s.kind] || 'var(--muted)'}"
                title="${esc(SOURCE_NAME[s.kind] || s.kind.toUpperCase())}"
                >${icon(s.kind)}</span></td>
      <td class="mono dim">${hhmm(s.at)}</td>
      <td class="call">${esc(s.call)}</td>
      <td>${s.hz ? (tune
          ? `<button class="freq" data-tune="${s.hz}" data-mode="${
                     esc(tuneMode(s))}" data-sideband="${esc(s.sideband || '')}"
                     title="Tune the radio here">${(s.hz / 1e6).toFixed(3)}</button>`
          : `<span class="freq">${(s.hz / 1e6).toFixed(3)}</span>`) : ''}</td>
      <td class="mono dim">${esc(s.band)}</td>
      <td class="mono${s.mode_from ? ' guessed' : ''}"${GUESSED[s.mode_from]
          ? ` title="${GUESSED[s.mode_from]}"` : ''}>${esc(s.mode)}</td>
      <td>${HD.flag(s.iso, s.country)}${esc(s.ref ? `${s.ref} ` : '')}<span
            class="ref">${esc(where(s))}</span></td>
      <td class="mono dim">${esc(s.spotter)}</td>
      <td class="dim">${s.snr_db !== undefined && s.snr_db !== null
          ? `<b>${s.snr_db} dB</b>${s.wpm ? ` · ${s.wpm} wpm` : ''} `
          : ''}${esc(String(s.comment || '').slice(0, 48))}</td>
    </tr>`).join('')}</tbody></table>`;
}

// Where a contest's name points. QSO Dates' bulk export has a `website`
// field and it is **empty on all 1000 rows**, measured against the live
// export, and their own site has no per-contest page either (every
// /activities/<id> shape answers 404). So for every contest in practice
// the honest link is a search, and the one dishonest thing would be to
// dress one up as the organiser's own page: `known` is false there and
// the underline goes dotted to say so before the click, not after.
//
// `website` is still read first, so the day they start filling it in this
// uses it with no change here. Nothing else in the row is worth scanning:
// the only real rules URL in the whole export is in a *logo_url*, and
// guessing at mislabelled fields is how you link somebody to a PNG.
function rules(c) {
  const direct = (c.website || '').trim();
  if (/^https?:\/\//i.test(direct)) {
    let host = direct;
    try { host = new URL(direct).hostname.replace(/^www\./, ''); } catch (e) {}
    return { url: direct, known: true, why: `Rules — ${host}` };
  }
  return {
    url: 'https://duckduckgo.com/?q='
         + encodeURIComponent(`${c.name} ${c.type || 'contest'} rules`),
    known: false,
    why: 'The calendar carries no rules page — searches the web for it',
  };
}

function paintContests() {
  const now = cons.now || Date.now() / 1000;
  const one = (c, on) => {
    const r = rules(c);
    return `<div class="con${on ? ' on' : ''}">
      <div class="name"><a href="${esc(r.url)}" target="_blank" rel="noopener"
         class="${r.known ? '' : 'guess'}" title="${esc(r.why)}"
         >${esc(c.name)}</a></div>
      <div class="meta">${esc(c.type)} · ${
        on ? `ends in ${ago(c.end - now)}`
           : `starts in ${ago(c.start - now)}`}${
        c.modes && c.modes.length ? ' · ' + esc(c.modes.join(', ')) : ''}${
        c.bands && c.bands.length ? ' · ' + esc(c.bands.join(', ')) : ''}
      </div></div>`;
  };
  $('#pane').innerHTML =
    `<h4>On now (${cons.on.length})</h4>`
    + (cons.on.length ? cons.on.map((c) => one(c, true)).join('')
                      : '<p class="empty">Nothing running.</p>')
    + `<h4>Next two weeks (${cons.soon.length})</h4>`
    + (cons.soon.length ? cons.soon.map((c) => one(c, false)).join('')
                        : '<p class="empty">Nothing scheduled.</p>')
    // The export is CC0 "free to use with attribution", and the docs
    // saying so is not the same as the operator being able to see whose
    // calendar this is. It is also the only link here that goes to a
    // page about these contests rather than to a search.
    + `<p class="credit">Calendar from <a href="https://www.qsodates.com/"
         target="_blank" rel="noopener">QSO Dates</a></p>`;
}

function paintStatus() {
  const bits = (data.sources || [])
    .filter((s) => !off.has(s.name))
    .map((s) => s.ok ? `${s.label || s.name} ${ago(s.age_s)}`
                     : `${s.label || s.name} — ${String(s.error).slice(0, 40)}`);
  // What the live feeds are narrowed to. On RBN this is the whole point,
  // so it is said rather than left for the operator to remember.
  if (data.watching) bits.unshift(`watching ${data.watching}`);
  $('#status').textContent = bits.join(' · ');
  $('#status').className = 'note'
    + ((data.sources || []).some((s) => !s.ok && !off.has(s.name)) ? ' warn' : '');
  $('#n-contests').textContent = cons.on.length ? `(${cons.on.length})` : '';
}

function paint() {
  (tab === 'spots' ? paintSpots : paintContests)();
  paintStatus();
}

// ---- talking to the card --------------------------------------------------
async function loadSpots(force) {
  // Behind another tab there is nobody to show it to, and these are four
  // hobby servers. The card's own floor would hold anyway; this is not
  // asking at all.
  if (HD.hidden && !force) return;
  try {
    data = await HD.card('spots', `/api/spots${force ? '?force=1' : ''}`);
    $('#err').textContent = '';
  } catch (e) { $('#err').textContent = e.message; return; }
  fillChoices();
  paintChips();
  if (tab === 'spots') paint(); else paintStatus();
}

async function loadContests(force) {
  if (HD.hidden && !force) return;
  try {
    cons = await HD.card('spots', `/api/contests${force ? '?force=1' : ''}`);
  } catch (e) { $('#err').textContent = e.message; return; }
  if (tab === 'contests') paint(); else paintStatus();
}

// ---- events ---------------------------------------------------------------
$('#filters').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const kind = chip.dataset.kind;
  if (off.has(kind)) off.delete(kind); else off.add(kind);
  paintChips();
  paint();
});

function paintChips() {
  const live = new Set((data.sources || []).map((s) => s.name));
  document.querySelectorAll('.chip').forEach((c) => {
    const kind = c.dataset.kind;
    // The live feeds are off unless this tile has them configured, so the
    // chip only appears when there is something behind it.
    if (kind === 'rbn' || kind === 'cluster') c.hidden = !live.has(kind);
    c.classList.toggle('off', off.has(kind));
    const dot = c.querySelector('.dot');
    dot.style.color = COLOUR[kind];
    if (!dot.firstChild) dot.innerHTML = icon(kind);
  });
}

$('#band').onchange = () => { filters.band = $('#band').value; paint(); };
$('#mode').onchange = () => { filters.mode = $('#mode').value; paint(); };
$('#q').addEventListener('input', () => { filters.q = $('#q').value; paint(); });
$('#clear').onclick = () => {
  filters = { band: '', mode: '', q: '' };
  $('#band').value = ''; $('#mode').value = ''; $('#q').value = '';
  off.clear(); paintChips(); paint();
};

$('#tab-spots').onclick = () => { tab = 'spots'; tabs(); paint(); };
$('#tab-contests').onclick = () => { tab = 'contests'; tabs(); paint(); };
function tabs() {
  $('#tab-spots').classList.toggle('on', tab === 'spots');
  $('#tab-contests').classList.toggle('on', tab === 'contests');
  $('#filters').hidden = tab !== 'spots';
}

$('#refresh').onclick = async (e) => {
  e.target.disabled = true;
  // The floor is in the card. This only means "do not wait for the poll",
  // and the card says no if the source was asked a moment ago.
  await Promise.all([loadSpots(true), loadContests(true)]);
  e.target.disabled = false;
};

// Which of a spot's modes may change the radio. Its own mode field always;
// one worked out from a comment or the frequency is good enough to filter
// on but not to switch the rig - except SSB, where the only choice left is
// which sideband, and the frequency settles that (`radioMode`).
function tuneMode(s) {
  if (!s.mode_from) return s.mode || '';
  return s.mode === 'SSB' ? 'SSB' : '';
}

// The mode to give the radio for a spot. A spot says "SSB"; a radio has
// LSB and USB and nothing called SSB, so sending it failed quietly and the
// radio stayed in whatever mode it was in. The convention picks the
// sideband: LSB below 10 MHz, USB from 10 MHz up - except 60 m, which is
// channelised and USB by regulation though it sits at 5.3 MHz. A spot that
// already says USB or LSB is left as it says.
function radioMode(mode, hz, sideband) {
  const m = String(mode || '').toUpperCase();
  if (m !== 'SSB') return m;
  // A comment that said which ("LSB JN54kp") beats the rule of thumb.
  const side = String(sideband || '').toUpperCase();
  if (side === 'USB' || side === 'LSB') return side;
  const mhz = Number(hz) / 1e6;
  if (mhz >= 5.25 && mhz <= 5.45) return 'USB';
  return mhz < 10 ? 'LSB' : 'USB';
}

// Tuning is deliberately the frequency itself rather than the whole row: a
// row-wide click would put the radio somewhere else on a mis-click.
$('#pane').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-tune]');
  if (!b) return;
  const hz = Number(b.dataset.tune);
  try {
    // Mode first, then the frequency. A radio applies its CW offset when
    // it *enters* CW, so setting the frequency and then the mode lands you
    // the width of that offset away from the station - 700 Hz on an FT-890,
    // which is a different signal, and reads as the spot being wrong rather
    // than as hamdash tuning wrong.
    const mode = radioMode(b.dataset.mode, hz, b.dataset.sideband);
    if (mode) await HD.radio.mode(mode).catch(() => {});
    await HD.radio.freq(hz);
    $('#err').textContent = '';
  } catch (err) { $('#err').textContent = err.message; }
  // Anything else that wants to know what we are looking at. Within this
  // card's own namespace; it is a pick, not a lookup result.
  const row = visible()[Number(b.closest('tr').dataset.i)];
  if (row) HD.publish('spots.picked', row).catch(() => {});
});

(async function boot() {
  try { conf = await HD.settings(); } catch { /* defaults will do */ }
  HD.onSettings((v) => { conf = v || {}; loadSpots(); });
  await HD.bands().catch(() => {});
  paintChips();
  tabs();
  await Promise.all([loadSpots(), loadContests()]);
  // The card holds the floor, so this is just "show me what it has".
  setInterval(loadSpots, 30000);
  setInterval(loadContests, 300000);
})();
</script>
</body>
</html>
