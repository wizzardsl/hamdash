<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  body { padding: 10px; overflow: auto; }
  .dial { font-family: var(--mono); font-size: clamp(20px, 6vw, 34px); letter-spacing: -0.01em; }
  .dial .frac { color: var(--muted); }
  .line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .band { color: var(--accent); font-family: var(--mono); font-size: 13px; }
  /* Not an error - plenty of listening happens outside the ham bands. */
  .band.off-band { color: var(--muted); font-family: inherit; }
  .state { color: var(--muted); font-size: 12px; }
  .state.tx { color: var(--alert); }
  .which { color: var(--accent); font-size: 12px; }
  .row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  input.freq { width: 9em; font-family: var(--mono); }
  select, input { font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--rule); border-radius: var(--radius); padding: 4px 6px; }
  .mem { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .mem button { font-size: 12px; padding: 3px 7px; }
  /* Dragged by the button itself, so a touch on one is ours and not the
     page's scroll; the long press for the menu needs that too. */
  .mem button { touch-action: none; user-select: none; }
  .mem button.dragging { opacity: .55; outline: 1px dashed var(--accent); }
  /* Saving one sits at the far end of the transmit row, under the step. */
  #mem-save { margin-left: auto; }
  .mem-note { font-size: 12px; color: var(--muted); margin-top: 6px;
              display: flex; gap: 8px; align-items: center; }
  .mem-note[hidden] { display: none; }    /* an author display beats [hidden] */
  .mem-note button { font-size: 12px; padding: 1px 7px; }
  /* A memory's own menu: right-click, or a long press on a touch screen. */
  .mem-menu { position: fixed; z-index: 10; min-width: 170px; padding: 4px;
              background: var(--panel); border: 1px solid var(--rule);
              border-radius: var(--radius); box-shadow: 0 6px 18px rgba(0,0,0,.35);
              display: flex; flex-direction: column; }
  .mem-menu[hidden] { display: none; }
  .mem-menu button { font: inherit; font-size: 12px; text-align: left;
                     color: var(--ink); background: none; border: 0;
                     border-radius: var(--radius); padding: 5px 8px; cursor: pointer; }
  .mem-menu button:hover, .mem-menu button:focus-visible { background: var(--panel-2); }
  .mem-menu button.danger { color: var(--alert); }
  .mem-dlg { border: 1px solid var(--rule); border-radius: var(--radius);
             background: var(--panel); color: var(--ink); padding: 12px;
             width: min(300px, 90vw); }
  .mem-dlg::backdrop { background: rgba(0,0,0,.4); }
  .mem-dlg h2 { font-size: 13px; margin: 0 0 2px; }
  .mem-dlg small { color: var(--muted); display: block; margin-bottom: 8px; }
  .mem-dlg input { width: 100%; box-sizing: border-box; }
  .mem-dlg .acts { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
  .ptt { background: var(--alert); color: var(--bg); }
  /* On the air. The label says so too, but a transmitting radio deserves
     something visible from across the room. */
  .ptt.on-air { animation: onair 1s steps(2, end) infinite; }
  @keyframes onair { 50% { opacity: .45; } }
  .err { color: var(--alert); font-size: 12px; margin-top: 8px; }
  /* The arrows sit with the dial, because that is the thing they move. */
  .tuner { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .tuner button {
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
    color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 2px 9px; min-width: 30px;
  }
  .tuner button:hover:not([disabled]) { color: var(--accent); border-color: var(--accent); }
  .tuner button:active:not([disabled]) { background: var(--accent); color: var(--bg); }
  .tuner button[disabled] { opacity: .4; cursor: default; }
  .tuner select { font-size: 12px; padding: 3px 5px; }

  /* The two VFOs. The live one is the dial; the other is there to be
     glanced at and switched to, which is the whole of working split. */
  .vfos { display: flex; gap: 6px; margin-top: 8px; }
  .vfos[hidden] { display: none; }        /* an author display beats [hidden] */
  .vfo { flex: 1; text-align: left; font: inherit; cursor: pointer;
         color: var(--muted); background: var(--panel-2);
         border: 1px solid var(--rule); border-radius: var(--radius);
         padding: 3px 7px; line-height: 1.25; }
  .vfo:hover:not([disabled]) { border-color: var(--accent); }
  .vfo[disabled] { cursor: default; }
  .vfo .tag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .vfo .hz { font-family: var(--mono); font-size: 13px; display: block; }
  .vfo.live { color: var(--ink); border-color: var(--accent); }
  .vfo.live .tag { color: var(--accent); }
  /* Which VFO transmits, when they are not the same one. Split is the one
     setting that silently puts you on a different frequency to the one on
     the dial, so it is said in words rather than left to a lit button. */
  .vfo.tx-on .tag::after { content: ' · TX'; color: var(--alert); }
  .vfo-acts { display: flex; flex-direction: column; gap: 4px; }
  .vfo-acts button { font-size: 11px; padding: 2px 7px; }
  .vfo-acts button.on { background: var(--accent); color: var(--bg);
                        border-color: var(--accent); }

  /* The meter. One bar: signal while receiving, power while transmitting,
     because the radio has one needle and so does this. */
  .meter { margin-top: 9px; }
  .meter[hidden] { display: none; }
  .meter .scale { display: flex; justify-content: space-between;
                  font-size: 9px; color: var(--muted); margin-bottom: 1px; }
  .meter .bar { height: 9px; border: 1px solid var(--rule);
                border-radius: var(--radius); overflow: hidden;
                background: var(--panel-2); }
  .meter .fill { height: 100%; width: 0; background: var(--accent);
                 transition: width .08s linear; }
  .meter.tx .fill { background: var(--alert); }
  .meter .read { font-size: 11px; color: var(--muted); margin-top: 2px;
                 display: flex; gap: 8px; }
  .meter .read b { color: var(--ink); font-family: var(--mono);
                   font-weight: 600; }

  /* Listening to this radio. Its own strip at the foot of the card: the
     audio is this radio's, so the controls sit with its dial rather than
     in a tile of their own. The player is /static/js/listen.js. */
  .listen-wrap { margin-top: 12px; padding-top: 8px;
                 border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<div class="line">
  <span class="dial" id="dial">--.------</span>
  <span class="band" id="band"></span>
  <span class="state" id="state"></span>
  <span class="which" id="which" hidden></span>
  <span class="tuner">
    <button id="down" title="Down one step (or the down arrow key)" aria-label="Tune down one step">&#9660;</button>
    <button id="up" title="Up one step (or the up arrow key)" aria-label="Tune up one step">&#9650;</button>
    <select id="step" aria-label="Tuning step" title="How far one press moves the dial"></select>
  </span>
</div>

<div class="row">
  <input class="freq mono" id="freq-in" placeholder="14.074000" inputmode="decimal">
  <button class="btn" id="tune">Tune</button>
  <select id="mode"></select>
  <button class="btn ptt" id="ptt">Transmit</button>
  <button class="btn btn-quiet" id="mem-save" type="button"
          title="Save this frequency and mode as a memory button">+ Memory</button>
</div>

<div class="vfos" id="vfos" hidden>
  <button class="vfo" id="vfo-a" aria-label="Select VFO A">
    <span class="tag">VFO A</span><span class="hz" id="hz-a">--</span>
  </button>
  <button class="vfo" id="vfo-b" aria-label="Select VFO B">
    <span class="tag">VFO B</span><span class="hz" id="hz-b">--</span>
  </button>
  <span class="vfo-acts">
    <button class="btn btn-quiet" id="split" title="Transmit on the other VFO">Split</button>
    <button class="btn btn-quiet" id="swap" title="Exchange what A and B hold">A&#8646;B</button>
  </span>
</div>

<div class="meter" id="meter" hidden>
  <div class="scale" id="m-scale"></div>
  <div class="bar"><div class="fill" id="m-fill"></div></div>
  <div class="read" id="m-read"></div>
</div>

<div class="mem" id="mem" aria-label="Memories. Right-click one to rename or delete it; drag to move it."></div>
<p class="mem-note" id="mem-note" hidden><span id="mem-note-text"></span>
  <button class="btn btn-quiet" id="mem-undo" type="button">Undo</button></p>
<div class="mem-menu" id="mem-menu" role="menu" hidden>
  <button type="button" role="menuitem" data-act="rename">Rename…</button>
  <button type="button" role="menuitem" data-act="update">Set to the current frequency</button>
  <button type="button" role="menuitem" data-act="delete" class="danger">Delete</button>
</div>
<dialog class="mem-dlg" id="mem-dlg">
  <form method="dialog" id="mem-form">
    <h2 id="mem-dlg-title">Name this memory</h2>
    <small id="mem-dlg-what"></small>
    <input id="mem-name" maxlength="24" autocomplete="off" aria-label="Memory name">
    <div class="acts">
      <button class="btn btn-quiet" value="cancel" type="button" id="mem-cancel">Cancel</button>
      <button class="btn" value="ok" id="mem-ok">Save</button>
    </div>
  </form>
</dialog>
<p class="err" id="err"></p>

<div class="listen-wrap" id="listen" aria-label="Listen to this radio"></div>

<script src="/static/js/hamdash.js"></script>
<script src="/static/js/listen.js"></script>
<script src="assets/memories.js"></script>
<script>
HD.cardId = 'rig_control';
const $ = (s) => document.querySelector(s);

// What one press moves the dial. The familiar ham steps rather than a
// round-numbers-only list: 9 kHz is European broadcast spacing and 12.5 kHz
// is the FM channel step, and a rig that cannot do them is not the point -
// this moves the frequency, it does not ask the rig for its own step table.
const STEPS = [
  [1, '1 Hz'], [10, '10 Hz'], [50, '50 Hz'], [100, '100 Hz'],
  [500, '500 Hz'], [1000, '1 kHz'], [2500, '2.5 kHz'], [5000, '5 kHz'],
  [9000, '9 kHz'], [10000, '10 kHz'], [12500, '12.5 kHz'],
  [25000, '25 kHz'], [100000, '100 kHz'], [1000000, '1 MHz'],
];
let conf = {};
// The radio this tile controls: the selected one unless its Radio setting
// names one. Everything below goes through this, never HD.radio directly.
let radio = HD.radio;
let live = null;              // the last state the rig gave us
let stepping = false;         // one request at a time while a key is held
let transmitting = false;     // what the *radio* last said, not this page

let holding = null;           // the keep-alive while we are transmitting

function setPtt(on) {
  const was = transmitting;
  transmitting = on;
  const b = $('#ptt');
  if (b) {
    b.textContent = on ? 'Stop transmitting' : 'Transmit';
    b.classList.toggle('on-air', on);
  }
  if (on === was) return;
  // Hold the transmission while this page is the one transmitting. The host
  // takes the rig off the air a few seconds after these stop - which is
  // what happens when the tile is closed, the card crashes or the browser
  // goes away, and is the only thing that would.
  // Bound to the radio that is on the air, not to whatever `radio` is
  // later: a ping to a radio that is *not* transmitting keys it.
  clearInterval(holding);
  const held = radio;
  holding = on ? setInterval(() => {
    held.ptt(true).catch(() => { /* the host's watchdog has it */ });
  }, 2000) : null;
  // The meter changes meaning when the radio does - signal one way, power
  // the other - and is watched harder during a transmission.
  if (metering && HD.visible) startMetering();
}

// What the rig can actually do, from the host rather than guessed from the
// backend's name: OmniRig has no meters at all, and whether a given rig
// file has two VFOs is a property of that file. A control nobody can use is
// not shown.
function can(what) { return (live && live.features || []).includes(what); }

function paintVfos(s) {
  const show = can('vfo') && (s.vfo || s.freq_a || s.freq_b);
  $('#vfos').hidden = !show;
  if (!show) return;
  // Blank when the radio will not say which VFO it is on - plenty can be
  // told and cannot report back. Lighting A on a guess is the same mistake
  // as calling an unknown PTT "receiving": the operator reads it as fact.
  const live_ = s.vfo || '';
  $('#vfos').classList.toggle('unsure', !live_);
  $('#vfos').title = live_ ? ''
    : 'This radio does not report which VFO it is using';
  // Which VFO is transmitting: the other one, when split is on. That is
  // the thing about split worth saying - the dial is not where you are
  // being heard.
  const txOn = s.split && live_ ? (live_ === 'A' ? 'B' : 'A') : live_;
  [['a', 'A'], ['b', 'B']].forEach(([id, name]) => {
    const hz = name === 'A' ? s.freq_a : s.freq_b;
    $(`#hz-${id}`).textContent = hz ? HD.fmtHz(hz) : '--';
    const b = $(`#vfo-${id}`);
    b.classList.toggle('live', live_ === name);
    b.classList.toggle('tx-on', s.split && txOn === name);
    // Nothing to select when the radio never told us that VFO's frequency
    // (rigctld cannot always read the one it is not on).
    b.disabled = !hz;
  });
  $('#split').hidden = !can('split');
  $('#split').classList.toggle('on', !!s.split);
  $('#split').setAttribute('aria-pressed', String(!!s.split));
  $('#swap').hidden = !can('swap');
}

// ---- the meter -------------------------------------------------------
// Polled, not pushed: a needle changes on every read, and radio.state is
// published on change, so carrying meters on the bus would wake every card
// on the board twice a second for a number only this tile draws.
let metering = null;

const S_SCALE = ['1', '3', '5', '7', '9', '+20', '+40', '+60'];
const P_SCALE = ['0', '', '50', '', '100%'];

function paintMeter(m) {
  const box = $('#meter');
  if (!m || m.ok === false) { box.hidden = true; return; }
  const tx = !!m.tx;
  box.hidden = false;
  box.classList.toggle('tx', tx);
  const pct = tx ? m.power_pct : m.s_pct;
  const bar = box.querySelector('.bar');
  // A meter that did not answer is not a zero, so there is no bar to draw.
  // While transmitting, say which it is: the meter vanishing at the moment
  // the radio goes on the air reads as the card breaking, when all it
  // means is that this rig does not measure power. Plenty do not - an
  // FT-900 through Hamlib refuses RFPOWER_METER outright.
  if (pct === undefined || pct === null) {
    if (!tx) { box.hidden = true; return; }
    box.hidden = false;
    bar.hidden = true;
    $('#m-scale').innerHTML = '';
    $('#m-read').textContent = 'This radio does not report transmit power';
    return;
  }
  bar.hidden = false;
  $('#m-fill').style.width = `${Math.max(0, Math.min(100, pct))}%`;
  $('#m-scale').innerHTML = (tx ? P_SCALE : S_SCALE)
    .map((t) => `<span>${t}</span>`).join('');
  const bits = [];
  if (tx) {
    // Watts only where the radio said what full scale is. Otherwise the
    // bar says how hard it is working and no number pretends to be watts.
    bits.push(m.power_w !== undefined
      ? `<b>${m.power_w}</b> W` : `<b>${Math.round(pct)}</b>% power`);
    if (m.swr) bits.push(`SWR <b>${m.swr}</b>`);
  } else {
    if (m.s_units) bits.push(`<b>${m.s_units}</b>`);
    if (m.s_dbm !== undefined && m.s_dbm !== null) bits.push(`${m.s_dbm} dBm`);
  }
  if (m.mock) bits.push('simulated');
  $('#m-read').innerHTML = bits.join(' ');
}

function meterPace() {
  // Faster while transmitting: power and SWR are what you watch a tune-up
  // with. Slower at rest, because this is a request per tick through the
  // proxy and a host thread for each one.
  return transmitting ? 250 : 500;
}

function startMetering() {
  clearInterval(metering);
  if (!(can('smeter') || can('power'))) { $('#meter').hidden = true; return; }
  let busy = false;
  const tick = async () => {
    // Don't stack requests on a radio that is answering slowly, and don't
    // poll at all for a tile nobody is looking at - a background tab stays
    // loaded, so it would otherwise keep asking for ever.
    if (busy || HD.hidden) return;
    busy = true;
    try { paintMeter(await radio.meters()); }
    catch { /* the state line already says when the rig is unreachable */ }
    finally { busy = false; }
  };
  metering = setInterval(tick, meterPace());
  tick();
}

// What somebody typed, in hertz.
//
// It used to be megahertz and nothing else - `parseFloat(v) * 1e6` - so
// `7041`, which is how most of the world writes 40m, asked the radio for
// 7041 MHz. Not an error, just somewhere else entirely. The three natural
// spellings of one frequency now land on the same place:
//
//   7.041  ->  7041000      MHz, the way a band plan reads
//   7041   ->  7041000      kHz, the way a spot reads
//   7041000->  7041000      Hz,  the way a log reads
//
// **No band checking.** A radio is a general-coverage receiver and where it
// is tuned is the operator's business; refusing a frequency because it is
// outside a ham band would be this program deciding what their licence
// says. Out of band is said, not prevented.
function parseFreq(text) {
  const v = parseFloat(String(text).replace(/[^0-9.]/g, ''));
  if (!Number.isFinite(v) || v <= 0) return 0;
  // Magnitude alone: nobody has a radio that reaches 1000 MHz and also
  // needs to type 1000 kHz as "1000", so the units are never ambiguous in
  // practice. Written out, 1 MHz is "1", 1000 kHz is "1000", 1000000 Hz is
  // "1000000" - and all three are 1 MHz.
  const unit = v < 1000 ? 1e6 : (v < 1e6 ? 1e3 : 1);
  return Math.round(v * unit);
}

function stepHz() {
  return Number($('#step').value) || 1000;
}

// Add and subtract rather than snapping to a grid: up then down puts the
// dial back exactly where it was, which a button ought to do. Snapping to
// the nearest multiple does not survive that round trip.
async function nudge(dir) {
  if (stepping || !live || !live.ok) return;
  const want = Math.max(0, (live.freq || 0) + dir * stepHz());
  stepping = true;
  try {
    paint(await radio.freq(want));
  } catch (e) {
    fail(e);
  } finally {
    stepping = false;
  }
}

function paint(s) {
  live = s;
  paintWhich(s);
  $('#up').disabled = $('#down').disabled = !s.ok;
  if (!s.ok) {
    $('#err').textContent = s.error || 'rig unavailable';
    $('#state').textContent = 'offline';
    $('#state').className = 'state';
    $('#vfos').hidden = $('#meter').hidden = true;
    return;
  }
  // The host says when it took a transmission off the air, so the operator
  // is told rather than the rig just stopping.
  $('#err').textContent = s.ptt_dropped || '';
  const mhz = HD.fmtHz(s.freq);
  const [whole, frac] = mhz.split('.');
  $('#dial').innerHTML = `${whole}.<span class="frac">${frac}</span>`;
  // A blank where the band goes reads as the card failing to work out an
  // answer. It has one: the radio is outside the ham bands, which is a
  // perfectly ordinary place for a general-coverage receiver to be and
  // worth knowing before a contact gets logged from it. Said, never
  // prevented - where the dial goes is the operator's business.
  $('#band').textContent = s.band || (s.freq ? 'out of band' : '');
  $('#band').classList.toggle('off-band', !s.band && !!s.freq);
  $('#state').textContent = s.ptt ? 'transmitting' : `${s.mode}${s.mock ? ' · simulated' : ''}`;
  $('#state').className = s.ptt ? 'state tx' : 'state';
  // The Transmit button follows the radio, not a flag of its own. It used
  // to keep `tx` in the page: reload while transmitting and the button read
  // "Transmit" while the radio was keyed, so the one control that takes a
  // transmitter off the air would have told it to key again. Anything that
  // keys the rig - this card, another program, the rig's own PTT - moves
  // the button, because `radio.state` is what moves it.
  setPtt(!!s.ptt);
  paintVfos(s);
  if ($('#mode').value !== s.mode && [...$('#mode').options].some(o => o.value === s.mode)) {
    $('#mode').value = s.mode;
  }
}

// ---- memories -----------------------------------------------------------
// Kept in the tile's settings, so they travel with the tile and a second
// rig tile on another radio has its own. Saved as `{memories}` alone: the
// host merges, so this cannot write back a stale copy of anything else.
let mems = [];
let memDrag = null;           // the drag in progress, if any
let memSuppress = false;      // the click that ends a drag or a long press
let menuAt = -1;              // which memory the menu is open for
let undoTimer = null;

const describe = (m) => `${HD.fmtHz(m.hz)} MHz ${m.mode}`.trim();

async function saveMems(list) {
  mems = list;
  renderMems();
  try { await HD.saveSettings({ memories: list }); } catch (e) { fail(e); }
}

function renderMems() {
  const box = $('#mem');
  box.innerHTML = '';
  mems.forEach((m, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn btn-quiet';
    b.textContent = m.label;
    b.dataset.i = String(i);
    b.title = `${describe(m)}. Right-click to rename or delete; drag to move.`;
    b.setAttribute('aria-label', `${m.label}, ${describe(m)}`);
    box.appendChild(b);
  });
}

async function recall(m) {
  try {
    // Mode before frequency: a radio applies its CW offset on entering CW,
    // so the other order leaves the dial that offset away from where the
    // memory said.
    await radio.mode(m.mode);
    paint(await radio.freq(m.hz));
  } catch (e) { fail(e); }
}

/* Name a memory: a new one from the dial, or an existing one renamed.
   An in-page dialog: the browser's own prompt box is chrome inside a webview. */
function askName(title, what, start) {
  const dlg = $('#mem-dlg');
  $('#mem-dlg-title').textContent = title;
  $('#mem-dlg-what').textContent = what;
  const input = $('#mem-name');
  input.value = start;
  return new Promise((resolve) => {
    const done = (v) => { dlg.close(); resolve(v); };
    $('#mem-form').onsubmit = (e) => { e.preventDefault(); done(input.value.trim() || null); };
    $('#mem-cancel').onclick = () => done(null);
    dlg.oncancel = (e) => { e.preventDefault(); done(null); };
    dlg.showModal();
    input.select();
  });
}

async function saveCurrent() {
  if (!live || !live.ok || !live.freq) {
    $('#err').textContent = 'No frequency to save - the radio is not answering.';
    return;
  }
  if (mems.length >= HDMem.MAX) {
    $('#err').textContent = `That is ${HDMem.MAX} memories - delete one to make room.`;
    return;
  }
  const m = { hz: live.freq, mode: live.mode || '' };
  const label = await askName('Name this memory', describe(m),
                              HDMem.suggest(m.hz, m.mode));
  if (label) saveMems([...mems, { ...m, label: label.slice(0, HDMem.MAX_LABEL) }]);
}

function removeAt(i) {
  const gone = mems[i];
  if (!gone) return;
  const before = mems.slice();
  saveMems(mems.filter((_, j) => j !== i));
  // Undo rather than "are you sure": deleting is quick to do by mistake on
  // a small button, and quick to put right.
  $('#mem-note-text').textContent = `Deleted \u201c${gone.label}\u201d.`;
  $('#mem-note').hidden = false;
  $('#mem-undo').onclick = () => { hideNote(); saveMems(before); };
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hideNote, 8000);
}

function hideNote() { clearTimeout(undoTimer); $('#mem-note').hidden = true; }

function openMenu(i, x, y) {
  menuAt = i;
  const menu = $('#mem-menu');
  menu.hidden = false;
  // Kept inside the card: the tile is small and the menu must not be cut
  // off by its edge.
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = `${Math.max(4, Math.min(x, innerWidth - w - 4))}px`;
  menu.style.top = `${Math.max(4, Math.min(y, innerHeight - h - 4))}px`;
  menu.querySelector('button').focus();
}

function closeMenu() { $('#mem-menu').hidden = true; menuAt = -1; }

async function menuAct(act) {
  const i = menuAt;
  const m = mems[i];
  closeMenu();
  if (!m) return;
  if (act === 'delete') removeAt(i);
  if (act === 'rename') {
    const label = await askName('Rename this memory', describe(m), m.label);
    if (label) saveMems(mems.map((x, j) => (j === i ? { ...x, label } : x)));
  }
  if (act === 'update') {
    if (!live || !live.ok || !live.freq) {
      $('#err').textContent = 'No frequency to save - the radio is not answering.';
      return;
    }
    saveMems(mems.map((x, j) => (j === i
      ? { ...x, hz: live.freq, mode: live.mode || x.mode } : x)));
  }
}

function wireMemories() {
  const box = $('#mem');
  $('#mem-save').onclick = saveCurrent;
  const at = (e) => {
    const b = e.target.closest('#mem button');
    return b ? Number(b.dataset.i) : -1;
  };

  box.addEventListener('click', (e) => {
    if (memSuppress) { memSuppress = false; return; }
    const i = at(e);
    if (i >= 0) recall(mems[i]);
  });
  box.addEventListener('contextmenu', (e) => {
    const i = at(e);
    if (i < 0) return;
    e.preventDefault();
    const r = e.target.getBoundingClientRect();
    // The context-menu key has no pointer position; put it by the button.
    const keyed = !e.clientX && !e.clientY;
    openMenu(i, keyed ? r.left : e.clientX, keyed ? r.bottom : e.clientY);
  });
  box.addEventListener('keydown', (e) => {
    const i = at(e);
    if (i < 0) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeAt(i); }
    // Moving one without a pointer: Alt and an arrow.
    if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      e.preventDefault();
      const to = i + (e.key === 'ArrowLeft' ? -1 : 1);
      if (to < 0 || to >= mems.length) return;
      saveMems(HDMem.move(mems, i, to));
      box.querySelector(`button[data-i="${to}"]`).focus();
    }
  });

  // Drag to reorder, and a long press for the menu on a touch screen. A
  // drag starts only once the pointer has moved, and the pointer is only
  // captured then - capturing on pointerdown would send the click to the
  // wrong place (see "setPointerCapture" in CLAUDE.md).
  box.addEventListener('pointerdown', (e) => {
    const i = at(e);
    if (i < 0 || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const btn = e.target.closest('button');
    const start = { x: e.clientX, y: e.clientY };
    let rects = null;
    let target = i;
    let held = null;
    if (e.pointerType !== 'mouse') {
      held = setTimeout(() => {
        held = null;
        if (memDrag) return;
        memSuppress = true;
        openMenu(i, start.x, start.y);
      }, 550);
    }
    const move = (ev) => {
      if (!memDrag) {
        if (Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 6) return;
        clearTimeout(held); held = null;
        memDrag = { from: i };
        try { btn.setPointerCapture(ev.pointerId); } catch { /* gone */ }
        // The boxes as they were, so the drop does not chase a layout that
        // is moving under it.
        rects = [...box.children].map((c) => c.getBoundingClientRect());
        btn.classList.add('dragging');
      }
      target = HDMem.dropIndex(rects, ev.clientX, ev.clientY, i);
      const others = [...box.children].filter((c) => c !== btn);
      box.insertBefore(btn, others[target] || null);
    };
    const end = (ev) => {
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', end);
      removeEventListener('pointercancel', end);
      removeEventListener('keydown', esc);
      clearTimeout(held);
      // The click a drag or a long press ends with is swallowed - but a
      // drag often ends with no click at all (the button moved out from
      // under the pointer), and a flag left set ate the next real press.
      // A click comes before any timer, so this clears it after.
      setTimeout(() => { memSuppress = false; }, 0);
      if (!memDrag) return;
      memDrag = null;
      memSuppress = true;
      // Released outside the card counts as put back, like Escape.
      if (ev && ev.type === 'pointerup' && target !== i) saveMems(HDMem.move(mems, i, target));
      else renderMems();
    };
    const esc = (ev) => { if (ev.key === 'Escape') { target = i; end(null); } };
    addEventListener('pointermove', move);
    addEventListener('pointerup', end);
    addEventListener('pointercancel', end);
    addEventListener('keydown', esc);
  });

  $('#mem-menu').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]');
    if (b) menuAct(b.dataset.act);
  });
  document.addEventListener('pointerdown', (e) => {
    if (!$('#mem-menu').hidden && !e.target.closest('#mem-menu')) closeMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#mem-menu').hidden) closeMenu();
  });
}

// Point the tile at the radio its settings name. Changing it while this
// tile has a radio on the air unkeys that one first: the keep-alive is
// about to stop, and saying so beats leaving it to the watchdog.
async function bind() {
  const want = HD.radio.for(conf.radio || 'selected');
  if (want.id === radio.id) return false;
  if (transmitting && holding) {
    try { await radio.ptt(false); } catch { /* the watchdog has it */ }
  }
  clearInterval(holding); holding = null; transmitting = false;
  radio = want;
  return true;
}

// Which radio, said in the tile only when it is not simply the selected
// one - a tile that names its radio should say which, or two rig tiles
// on two radios look identical.
function paintWhich(s) {
  const w = $('#which');
  w.hidden = !radio.id;
  w.textContent = radio.id ? (s.rig || radio.id) : '';
}

async function boot() {
  try { conf = await HD.settings(); } catch { /* defaults will do */ }
  await bind();
  // The radio's receive audio. Read through `conf` on every request, so a
  // change of input in this tile's settings applies at the next poll.
  HDListen.mount($('#listen'), { conf: () => conf });
  $('#step').innerHTML = STEPS.map(([hz, label]) =>
    `<option value="${hz}">${label}</option>`).join('');
  $('#step').value = String(Number(conf.step_hz) || 1000);
  // Kept on the tile, so two rig tiles can step differently and the choice
  // travels with the tile.
  $('#step').onchange = async () => {
    conf = { ...conf, step_hz: Number($('#step').value) };
    // Only what changed: the host merges, and sending the whole of `conf`
    // could put back a memory list another browser has just edited.
    try { await HD.saveSettings({ step_hz: conf.step_hz }); } catch { /* still applies now */ }
  };
  HD.onSettings(async (v) => {
    conf = v || {};
    if (conf.step_hz) $('#step').value = String(conf.step_hz);
    // Another browser on this tile saved its memories; not mid-drag, when
    // redrawing would drop the button out from under the pointer.
    if (!memDrag) { mems = HDMem.clean(conf.memories); renderMems(); }
    if (await bind()) {
      try { paint(await radio.state()); } catch (e) { fail(e); }
      if (metering) startMetering();
    }
  });

  $('#up').onclick = () => nudge(1);
  $('#down').onclick = () => nudge(-1);
  // The arrow keys do the same, unless the operator is typing a frequency
  // into the box - where up and down belong to the box.
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowUp') { e.preventDefault(); nudge(1); }
    if (e.key === 'ArrowDown') { e.preventDefault(); nudge(-1); }
  });

  const modes = await HD.radio.modes();
  $('#mode').innerHTML = modes.map(m => `<option>${m}</option>`).join('');
  $('#mode').onchange = (e) => radio.mode(e.target.value).then(paint).catch(fail);

  $('#tune').onclick = () => {
    const hz = parseFreq($('#freq-in').value);
    if (!hz) {
      $('#err').textContent =
        'Enter a frequency: 14.074, 14074 or 14074000 all mean the same thing';
      return;
    }
    radio.freq(hz).then(paint).catch(fail);
  };
  $('#freq-in').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#tune').click(); });

  $('#ptt').onclick = () => {
    // Asked for the opposite of what the radio is doing, not of what this
    // page last did.
    radio.ptt(!transmitting).then(paint).catch(fail);
  };

  mems = HDMem.clean(conf.memories);
  renderMems();
  wireMemories();
  // The memories wrap onto rows as there are more of them; the tile grows
  // a row to keep them all on screen, and gives it back when they go.
  HD.autoHeight();

  $('#vfo-a').onclick = () => radio.vfo('A').then(paint).catch(fail);
  $('#vfo-b').onclick = () => radio.vfo('B').then(paint).catch(fail);
  $('#swap').onclick = () => radio.swapVfo().then(paint).catch(fail);
  // Asked for the opposite of what the radio says, not of what this page
  // last drew - the same rule the Transmit button is built on.
  $('#split').onclick = () =>
    radio.split(!(live && live.split)).then(paint).catch(fail);

  paint(await radio.state());
  // The selected radio says what it is doing on `radio.state`; every open
  // radio says it on `radio.rig` too. A tile follows exactly one of them.
  HD.on('radio.state', (s) => { if (!radio.id) paint(s); });
  HD.on('radio.rig', (s) => { if (radio.id && s.rig_id === radio.id) paint(s); });
  startMetering();
  // A hidden tab keeps running, so it is told. Without this a stacked rig
  // tile polls the radio for ever from behind another card.
  HD.onVisible((shown) => {
    if (shown) startMetering();
    else { clearInterval(metering); metering = null; }
  });
}

function fail(e) { $('#err').textContent = e.message; }
boot().catch(fail);
</script>
</body>
</html>
