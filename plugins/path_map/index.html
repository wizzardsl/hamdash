<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  html, body { height: 100%; }
  body { padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .bar { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; font-size: 12px; }
  .who { font-family: var(--mono); color: var(--accent); font-size: 14px; }
  .muted { color: var(--muted); }
  .wrap { flex: 1; min-height: 60px; }
  svg { width: 100%; height: 100%; display: block; }
  .land { fill: var(--panel-2); stroke: var(--grip); stroke-width: .4; vector-effect: non-scaling-stroke; }
  .grat { stroke: var(--rule); stroke-width: .3; fill: none; vector-effect: non-scaling-stroke; }
  .path { stroke: var(--accent); stroke-width: 1.6; fill: none;
          vector-effect: non-scaling-stroke; stroke-linecap: round; }
  .err { color: var(--alert); font-size: 12px; }
</style>
</head>
<body>

<div class="bar">
  <span class="who" id="who">—</span>
  <span class="muted" id="detail"></span>
</div>
<div class="wrap"><svg id="map" role="img" aria-labelledby="t"><title id="t">Map</title></svg></div>
<p class="err" id="err"></p>

<script src="/static/js/hamdash.js"></script>
<script src="world.js"></script>
<script>
HD.cardId = 'path_map';
const $ = (s) => document.querySelector(s);
const SVGNS = 'http://www.w3.org/2000/svg';
const D2R = Math.PI / 180;

let conf = {};
let me = null;        // {lat, lon, grid, call}
let them = null;      // {lat, lon, grid, call, path}

// --- Maidenhead, client side ------------------------------------------------
// The host has the same maths, but a locator is cheap to decode and the map
// should not need a round trip to move a pin.
function toLatLon(loc) {
  const s = (loc || '').trim().toUpperCase();
  if (!/^[A-R]{2}[0-9]{2}([A-X]{2}([0-9]{2})?)?$/.test(s)) return null;
  const A = (c) => c.charCodeAt(0) - 65;
  let lon = A(s[0]) * 20 - 180, lat = A(s[1]) * 10 - 90;
  lon += (+s[2]) * 2; lat += (+s[3]);
  if (s.length >= 6) {
    lon += A(s[4]) * (2 / 24); lat += A(s[5]) * (1 / 24);
    lon += 1 / 24; lat += 1 / 48;
  } else { lon += 1; lat += 0.5; }
  return { lat, lon };
}

// --- great circle -----------------------------------------------------------
// A straight line on an equirectangular map is not the path a signal takes.
// Sample the real great circle and split it where it crosses the antimeridian,
// or it draws a stripe back across the whole world.
function greatCircle(a, b, steps = 128) {
  const toVec = (p) => {
    const la = p.lat * D2R, lo = p.lon * D2R;
    return [Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)];
  };
  const [v1, v2] = [toVec(a), toVec(b)];
  const dot = Math.max(-1, Math.min(1, v1[0] * v2[0] + v1[1] * v2[1] + v1[2] * v2[2]));
  const om = Math.acos(dot);
  const segs = [];
  let run = [];
  let prevLon = null;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    let p;
    if (om < 1e-9) { p = v1; } else {
      const s1 = Math.sin((1 - t) * om) / Math.sin(om);
      const s2 = Math.sin(t * om) / Math.sin(om);
      p = [v1[0] * s1 + v2[0] * s2, v1[1] * s1 + v2[1] * s2, v1[2] * s1 + v2[2] * s2];
    }
    const lat = Math.atan2(p[2], Math.hypot(p[0], p[1])) / D2R;
    const lon = Math.atan2(p[1], p[0]) / D2R;
    if (prevLon !== null && Math.abs(lon - prevLon) > 180) {
      segs.push(run); run = [];
    }
    run.push([lon, lat]);
    prevLon = lon;
  }
  if (run.length) segs.push(run);
  return segs.filter((s) => s.length > 1);
}

// --- drawing ----------------------------------------------------------------
function el(name, attrs) {
  const n = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  return n;
}

function viewBox() {
  if ((conf.zoom || 'fit the path') === 'whole world' || !me || !them) {
    return [-180, -90, 360, 180];
  }
  // Work in projected coordinates, where y is -lat. Framing on latitude and
  // then using it as an SVG y centres the view on the mirror of the path in
  // the other hemisphere, which looks like an empty ocean.
  const pad = 18;
  const xs = [me.lon, them.lon];
  const ys = [-me.lat, -them.lat];
  const x1 = Math.min(...xs) - pad, x2 = Math.max(...xs) + pad;
  const y1 = Math.min(...ys) - pad, y2 = Math.max(...ys) + pad;
  // A path the long way round the planet is not usefully "framed"; show it all.
  if (x2 - x1 > 300) return [-180, -90, 360, 180];
  const w = Math.max(x2 - x1, 30), h = Math.max(y2 - y1, 18);
  const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
  return [cx - w / 2, cy - h / 2, w, h];
}

function pin(p, colour, label, k) {
  // `k` scales the marker with the view. Sizes here are in degrees, so a pin
  // fixed at r=2.2 is a reasonable dot on a whole-world view and a blob the
  // size of Spain once the view zooms to a short path. Scaling by the view
  // width keeps it the same size on screen at any framing.
  const g = el('g', { transform: `translate(${p.lon} ${-p.lat})` });
  g.appendChild(el('circle', { r: 2.2 * k, fill: colour, stroke: 'var(--bg)',
                               'stroke-width': 0.7 * k }));
  const t = el('text', { x: 3.4 * k, y: 1.6 * k, 'font-size': 5.5 * k,
                         fill: colour, 'font-family': 'var(--mono)' });
  t.textContent = label;
  g.appendChild(t);
  return g;
}

function draw() {
  const svg = $('#map');
  svg.innerHTML = '';
  const [vx, vy, vw, vh] = viewBox();
  svg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  // Land is stored as raw lon/lat, so the whole layer is flipped once here
  // rather than negating every coordinate at build time.
  const land = el('g', { transform: 'scale(1 -1)' });
  (window.WORLD_LAND || []).forEach((d) => land.appendChild(el('path', { d, class: 'land' })));
  svg.appendChild(land);

  if (conf.graticule !== false) {
    const g = el('g', { class: 'grat' });
    for (let lon = -180; lon <= 180; lon += 30) {
      g.appendChild(el('line', { x1: lon, y1: -90, x2: lon, y2: 90 }));
    }
    for (let lat = -60; lat <= 60; lat += 30) {   // poles carry no information
      g.appendChild(el('line', { x1: -180, y1: -lat, x2: 180, y2: -lat }));
    }
    g.appendChild(el('line', { x1: -180, y1: 0, x2: 180, y2: 0,
                               'stroke-width': .6 }));
    svg.appendChild(g);
  }

  if (me && them && conf.great_circle !== false) {
    greatCircle(me, them).forEach((seg) => {
      svg.appendChild(el('polyline', {
        class: 'path',
        points: seg.map(([lo, la]) => `${lo},${-la}`).join(' '),
      }));
    });
  }
  const k = vw / 360;                       // 1 at whole-world, smaller zoomed in
  if (me) svg.appendChild(pin(me, 'var(--signal)', me.call || 'home', k));
  if (them) svg.appendChild(pin(them, 'var(--accent)', them.call || '', k));
}

// --- state ------------------------------------------------------------------
async function loadMe() {
  try {
    const st = await HD.station();
    const at = toLatLon(st.grid);
    me = at ? { ...at, grid: st.grid, call: st.callsign || 'home' } : null;
    $('#err').textContent = me ? ''
      : 'Your grid is not set — Settings has a "Use my location" button.';
  } catch (e) { $('#err').textContent = e.message; }
}

function show(info) {
  const at = toLatLon(info.locator);
  if (!at) {
    // Saying nothing would leave the previous station on the map while the
    // operator is looking at a different callsign, which is worse than an
    // empty map: it is a confident wrong answer.
    them = null;
    $('#who').textContent = info.callsign || '—';
    $('#detail').textContent = 'no grid known'
      + (info.source ? ` (via ${info.source})` : '');
    draw();
    return;
  }
  them = { ...at, grid: info.locator, call: info.callsign || '' };
  $('#who').textContent = info.callsign || info.locator;
  const bits = [];
  if (info.locator) bits.push(info.locator);
  if (info.country) bits.push(info.country);
  if (info.path) {
    bits.push(`${info.path.km.toLocaleString()} km`);
    bits.push(`${Math.round(info.path.bearing)}° ${HD.bearingName(info.path.bearing)}`);
  }
  if (info.approximate) bits.push('approximate');
  $('#detail').textContent = bits.join(' · ');
  draw();
}

HD.on('lookup.result', (p) => { if (p.locator) show(p); });
HD.on('config.changed', () => loadMe().then(draw));
HD.onSettings((v) => { conf = v; draw(); });
window.addEventListener('resize', draw);

(async function boot() {
  conf = await HD.settings();
  await loadMe();
  draw();
})();
</script>
</body>
</html>
