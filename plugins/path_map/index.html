<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<style>
  html, body { height: 100%; }
  body { padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .bar { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; font-size: 12px; }
  .who { font-family: var(--mono); color: var(--accent); font-size: 14px; }
  .muted { color: var(--muted); }
  #map { flex: 1; min-height: 60px; border-radius: var(--radius);
         background: var(--bg); }

  /* Leaflet ships a light theme; this is a dark board. */
  .leaflet-container { background: var(--bg); font: inherit; font-size: 12px; }
  .leaflet-bar a, .leaflet-control-layers, .leaflet-popup-content-wrapper,
  .leaflet-popup-tip {
    background: var(--panel); color: var(--ink); border-color: var(--rule);
  }
  /* Leaflet sets this one with its own container-scoped rule, so match that
     specificity or the credit line stays a white strip on a dark map. */
  .leaflet-container .leaflet-control-attribution {
    background: var(--panel); color: var(--muted);
    border-top: 1px solid var(--rule);
  }
  .leaflet-container .leaflet-control-attribution a { color: var(--muted); }
  .leaflet-bar a { border-bottom-color: var(--rule); }
  .leaflet-bar a:hover { background: var(--panel-2); color: var(--accent); }
  .leaflet-control-attribution a { color: var(--muted); }
  .leaflet-control-layers-expanded { color: var(--ink); padding: 7px 9px; }
  .leaflet-popup-content { margin: 8px 10px; }
  .leaflet-popup-content h3 { margin: 0 0 3px; font-family: var(--mono);
    font-size: 14px; color: var(--accent); font-weight: 500; }
  .leaflet-popup-content dl { margin: 0; display: grid;
    grid-template-columns: auto 1fr; gap: 1px 8px; }
  .leaflet-popup-content dt { color: var(--muted); }
  .leaflet-popup-content dd { margin: 0; font-family: var(--mono); }
  .leaflet-popup-content .links { margin-top: 5px; display: flex; gap: 8px; }
  .leaflet-popup-content .links a { color: var(--signal); font-size: 11px; }
  /* Leaflet's tooltip is a light chip by default. */
  .pin-label { background: transparent; border: 0; box-shadow: none;
    color: var(--ink); font-family: var(--mono); font-size: 11px;
    padding: 0; text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); }
  .pin-label::before { display: none; }
  .sun-icon { background: none; border: 0; }
  .err { color: var(--alert); font-size: 12px; }
  /* The scale for the band-to-here overlay. Bottom left, out of the way
     of Leaflet's own controls. */
  .key { position: absolute; left: 8px; bottom: 22px; z-index: 500;
         background: color-mix(in srgb, var(--panel) 88%, transparent);
         border: 1px solid var(--rule); border-radius: var(--radius);
         padding: 5px 7px; font-size: 10px; color: var(--muted);
         pointer-events: none; line-height: 1.5; }
  .key b { display: block; color: var(--ink); font-size: 10px;
           font-weight: 600; margin-bottom: 3px; }
  .key span { display: inline-flex; align-items: center; gap: 3px;
              margin-right: 6px; font-family: var(--mono); }
  .key i { width: 11px; height: 8px; border-radius: 2px; display: block; }
  .key em { display: block; font-style: normal; margin-top: 3px;
            opacity: .85; }
</style>
</head>
<body>

<div class="bar">
  <span class="who" id="who">—</span>
  <span class="muted" id="detail"></span>
</div>
<div id="map"></div>
<p class="err" id="err"></p>

<script src="/static/js/hamdash.js"></script>
<script src="prop.js"></script>
<script src="/static/vendor/leaflet.js"></script>
<script src="/static/vendor/proj4.js"></script>
<script src="/static/vendor/proj4leaflet.js"></script>
<script src="/static/vendor/world.js"></script>
<script src="/static/vendor/borders.js"></script>
<script src="/static/js/hdmap.js"></script>
<script>
HD.cardId = 'path_map';
const $ = (s) => document.querySelector(s);
const D2R = HDMap.D2R;

// The shared map machinery lives in /static/js/hdmap.js, so the PSK card and
// this one cannot drift apart on what a world copy is or where the basemap
// sits. Local names for the pieces used here, so the rest of this file reads
// as it did when they lived in it.
const THEME = HDMap.theme;
const { toLatLon, unwrapLon, endpoint, greatCircle, readTheme } = HDMap;
const worldCopies = HDMap.copies;

let conf = {};
let map = null;
let me = null;          // {lat, lon, grid, call}
let them = null;
let lastInfo = null;
let touched = false;    // has the operator moved the map themselves?
let auroraTimer = null;
let sounders = [];       // live ionosondes, for the path MUF
let bandTable = [];      // the host's one band table
let drapGrid = null;     // absorption raster, sampled over the path
let drapBytes = null;
const L_ = {};          // layers, by name

function wantAzimuthal() {
  return (conf.projection || 'flat').startsWith('azimuthal') && !!me;
}

// --- pins --------------------------------------------------------------------
function popupFor(which) {
  const i = lastInfo || {};
  const esc = (v) => String(v).replace(/[&<>"]/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rows = [];
  const add = (k, v) => { if (v) rows.push(`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`); };
  let title, links = '';
  if (which === 'me') {
    title = me.call || 'My station';
    add('Grid', me.grid);
    add('Latitude', me.lat.toFixed(3));
    add('Longitude', me.lon.toFixed(3));
  } else {
    title = them.call || them.grid;
    add('Grid', them.grid);
    add('Name', i.name);
    add('Country', i.country);
    if (i.path) {
      add('Distance', HD.fmtDistance(i.path.km));
      add('Bearing', `${Math.round(i.path.bearing)}° ${HD.bearingName(i.path.bearing)}`);
      add('Long path', `${Math.round((i.path.bearing + 180) % 360)}°`);
      propRows(add, them);
    }
    const seen = (i.worked_before || []).length;
    if (seen) add('Worked', `${seen}× before`);
    add('Source', i.approximate ? `${i.source} (approximate)` : i.source);
    // Plain anchors: hamdash.js routes target=_blank to the real browser,
    // because an unhandled new-window request inside a webview escapes to
    // the OS.
    links = Object.entries(i.links || {}).map(([n, href]) =>
      `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(n)}</a>`).join('');
  }
  const flag = which === 'me' ? '' : HD.flag(i.iso, i.country);
  return `<h3>${flag}${esc(title)}</h3><dl>${rows.join('')}</dl>`
       + (links ? `<div class="links">${links}</div>` : '');
}

/* ---- what the path will carry -----------------------------------------
 *
 * Measured, not modelled: the MUF comes from the nearest ionosonde that
 * has actually sounded recently, and the readout says which one and how
 * far away it was. About thirty of the hundred stations are live at any
 * moment and they are clustered over Europe, North America and
 * Australia, so for a path across an ocean the supporting sounding can
 * be a very long way from where the signal really refracts. Saying so is
 * the difference between a measurement and a guess with a decimal point.
 */
async function loadProp() {
  try {
    const d = await HD.get('/api/space/muf');
    sounders = (d && (d.stations || d)) || [];
  } catch (e) { sounders = []; }
  try {
    bandTable = await HD.bands();
  } catch (e) { bandTable = []; }
  try {
    const d = await HD.get('/api/space/drap', { threshold: 1, grid: 1 });
    drapGrid = (d && d.grid && d.grid.data) ? d.grid : null;
    if (drapGrid) {
      const bin = atob(drapGrid.data);
      drapBytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) drapBytes[i] = bin.charCodeAt(i);
    }
  } catch (e) { drapGrid = null; drapBytes = null; }
  // New soundings mean a new field, if anybody is looking at it.
  if (L_.area && map && map.hasLayer(L_.area)) drawArea();
}

/* The absorption being measured over the path, in MHz.
 *
 * D-RAP is the *flare-driven* part: on a quiet day it is zero
 * everywhere, and that does not mean 160 m is open to Japan at noon -
 * ordinary daytime D-layer absorption is not in this number. So it is
 * reported as "absorbed below X" when there is something to report, and
 * left out entirely when there is not, rather than being dressed up as a
 * LUF it is not.
 */
function absorptionOver(controls) {
  if (!drapGrid || !drapGrid.data || !drapBytes) return 0;
  let worst = 0;
  controls.forEach((c) => {
    const g = drapGrid;
    const ix = Math.round((c.at.lon - g.lon0) / g.step_lon);
    const iy = Math.round((c.at.lat - g.lat0) / g.step_lat);
    if (ix < 0 || ix >= g.w || iy < 0 || iy >= g.h) return;
    worst = Math.max(worst, drapBytes[iy * g.w + ix] || 0);
  });
  return worst;
}

function propRows(add, target) {
  if (!me || !target || !HDProp) return;
  const to = toLatLon(target.grid || '') || target;
  if (!Number.isFinite(to.lat) || !Number.isFinite(to.lon)) return;

  const p = HDProp.pathMuf(me, to, sounders);
  if (p.mhz === null) {
    // An answer, not a failure: most of the Pacific is like this most of
    // the time, and pretending otherwise is the thing to avoid.
    add('Path MUF', `not known — ${p.why}`);
    return;
  }

  const hops = p.hops === 1 ? '1 hop' : `${p.hops} hops`;
  add('Path MUF', `${p.mhz.toFixed(1)} MHz · ${hops}`
    + (p.uncertain ? ' · uncertain' : ''));

  /* What we know is the *top* of the window, because that is what a
     sounding measures. The bottom we barely know: D-RAP carries the
     flare-driven absorption and nothing else, so on a quiet day it is
     zero - which does not mean 160 m is open to Europe at noon.

     So this reports the highest band the path will carry, and says
     'and below' rather than enumerating down to nothing. The first
     version listed everything under the MUF and proudly offered 2200 m
     and 630 m, which propagate by a different mechanism entirely and
     were never a claim worth making. */
  const low = absorptionOver(p.controls);
  const HF_FLOOR = 1.8;           // below this is not an F2 question
  const open = HDProp.bandsBetween(bandTable, Math.max(low, HF_FLOOR),
                                   p.mhz);
  if (open.length) {
    const best = open[open.length - 1];
    const rest = open.slice(0, -1).slice(-2).reverse();
    add('Highest band', best + (rest.length ? ` (then ${rest.join(' ')})` : ''));
  } else {
    add('Highest band', low > 0
      ? 'nothing between the absorption and the MUF'
      : 'the MUF is below the HF bands');
  }
  if (low > 0) {
    // Only when there is something to report: a flare is the one thing
    // that takes the bottom of the window away on a timescale anybody
    // notices.
    add('Absorbed below', `${low} MHz — solar flare`);
  }
  // Which sounding this rests on, and how far away it was. The whole
  // point: a number from 4000 km away is a different claim from one
  // measured over the path.
  add('From sounding', `${p.from.name} · ${HD.fmtDistance(p.from.km)} from `
    + `the ${p.hops === 1 ? 'midpoint' : 'control point'}`
    + (p.from.age_h > 1 ? ` · ${p.from.age_h.toFixed(1)} h old` : ''));
}

/* ---- the band-to-here overlay -----------------------------------------
 *
 * The single-path readout swept across the map: every pixel is the MUF
 * for the path from the operator to that place. Centred on the station
 * by construction - unlike the familiar MUF map, which is MUF(3000)
 * plotted at each point and says nothing about where you are standing.
 *
 * Drawn as one image per world copy and left for the browser to
 * interpolate, the way the aurora is. Three degrees: the field is smooth,
 * and measured, 3 deg is 7320 points in 225 ms where 2 deg is 16380 in
 * 533 - which is the difference between a pause and a freeze.
 *
 * **The fade is the honest part.** Every point finds *some* nearest
 * sounder, however far away, so nothing comes back unknown and the
 * confidence has to be drawn rather than stated. Measured against the
 * live network: eastern US 989 km from the nearest sounding, Europe
 * 1644, mid-Pacific 3970, Antarctica 4327. So solid to 1500 km and
 * ghostly past 5000, and the ocean looks like the guess it is.
 */
const AREA_FULL_MHZ = 30;       // top of the colour ramp
const AREA_SOLID_KM = 1200;     // supported this close: drawn in full
const AREA_FADED_KM = 4500;     // further than this: barely there
/* It is an overlay, not a replacement. The first attempt peaked at 190
   of 255 and the continents simply vanished underneath it - and a
   propagation map you cannot see the land through tells you the band
   and not the place, which is half an answer. */
const AREA_ALPHA = 105;

let areaTimer = null;

function areaConfidence(farKm) {
  if (!Number.isFinite(farKm)) return 0;
  if (farKm <= AREA_SOLID_KM) return 1;
  const t = (farKm - AREA_SOLID_KM) / (AREA_FADED_KM - AREA_SOLID_KM);
  return Math.max(0.07, 1 - t);
}

function areaImage(field) {
  const c = document.createElement('canvas');
  c.width = field.w;
  c.height = field.h;
  const img = c.getContext('2d').createImageData(field.w, field.h);
  const px = img.data;
  const stops = [HDMap.hex2rgb(THEME.signal), HDMap.hex2rgb(THEME.accent),
                 HDMap.hex2rgb(THEME.alert)];
  for (let iy = 0; iy < field.h; iy++) {
    // The field runs south to north; image rows run top down.
    const row = (field.h - 1 - iy) * field.w;
    for (let ix = 0; ix < field.w; ix++) {
      const i = iy * field.w + ix;
      const o = (row + ix) * 4;
      const mhz = field.muf[i];
      const conf = areaConfidence(field.far[i]);
      if (!(mhz > 0) || conf <= 0) { px[o + 3] = 0; continue; }
      // Colour carries the frequency; alpha carries how much we know.
      // Using the ramp's own alpha would say a low MUF is "less there",
      // which is a different claim and not the one being made.
      const rgb = HDMap.fieldRamp(mhz, AREA_FULL_MHZ, stops);
      px[o] = rgb[0]; px[o + 1] = rgb[1]; px[o + 2] = rgb[2];
      px[o + 3] = Math.round(AREA_ALPHA * conf);
    }
  }
  c.getContext('2d').putImageData(img, 0, 0);
  return c.toDataURL('image/png');
}

function drawArea() {
  if (!L_.area) return;
  L_.area.clearLayers();
  // The legend belongs to the layer, so it goes when the layer does -
  // a scale with nothing to scale is just a box in the corner.
  if (!map.hasLayer(L_.area) || !me || !HDProp) { areaLegend(null); return; }
  const list = HDProp.asList(sounders);
  if (!list.length) { areaLegend(null); return; }
  const field = HDProp.mufField(me, list, { step: 3 });
  const url = areaImage(field);
  // Half a cell beyond the grid on each side: the values sit at cell
  // centres, and at three degrees half a cell is 1.5 of them.
  const hx = field.step_lon / 2, hy = field.step_lat / 2;
  const south = field.lat0 - hy;
  const north = field.lat0 + (field.h - 1) * field.step_lat + hy;
  const west = field.lon0 - hx;
  const east = field.lon0 + (field.w - 1) * field.step_lon + hx;
  HDMap.each((dx) => L.imageOverlay(url,
    [[south, west + dx], [north, east + dx]],
    { opacity: 1, interactive: false }).addTo(L_.area));
  areaLegend(field);
}

/* A colour field with no scale beside it is decoration. */
function areaLegend(field) {
  let el = $('#area-key');
  if (!field) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div');
    el.id = 'area-key';
    el.className = 'key';
    document.querySelector('#map').appendChild(el);
  }
  const stops = [HDMap.hex2rgb(THEME.signal), HDMap.hex2rgb(THEME.accent),
                 HDMap.hex2rgb(THEME.alert)];
  const swatch = (mhz) => {
    const c = HDMap.fieldRamp(mhz, AREA_FULL_MHZ, stops);
    return `<i style="background:rgb(${c[0]},${c[1]},${c[2]})"></i>`;
  };
  el.innerHTML = '<b>Highest frequency to here</b>'
    + [3, 7, 14, 21, 28].map((f) =>
        `<span>${swatch(f)}${f}</span>`).join('')
    + '<em>faded where the nearest sounding is far from the path</em>';
}

function drawStation() {
  if (!L_.station) return;
  L_.station.clearLayers();
  const copies = worldCopies();
  if (me && them && conf.great_circle !== false) {
    const run = greatCircle(me, them);
    copies.forEach((dx) => {
      L.polyline(run.map(([lat, lon]) => [lat, lon + dx]),
                 { color: THEME.accent, weight: 2, interactive: false })
        .addTo(L_.station);
    });
  }
  const pin = (p, colour, label, which) => copies.forEach((dx) =>
    L.circleMarker([p.lat, p.lon + dx], {
      radius: 6, color: THEME.bg, weight: 1.5,
      fillColor: colour, fillOpacity: 1,
    }).bindTooltip(label, { permanent: true, direction: 'right',
                            className: 'pin-label', offset: [6, 0] })
      .bindPopup(() => popupFor(which), { maxWidth: 280 })
      .addTo(L_.station));
  if (me) pin(me, THEME.signal, me.call || 'home', 'me');
  // Same unwrapping as the path, so the pin sits on the end of its line.
  if (them) pin(endpoint(me, them), THEME.accent, them.call || them.grid, 'them');
}

// --- framing -----------------------------------------------------------------
function fit() {
  if (!map) return;
  if ((conf.zoom || 'fit the path') === 'whole world' || !me || !them) {
    map.setView([20, 0], 1);
    return;
  }
  const far = endpoint(me, them);
  map.fitBounds(L.latLngBounds([[me.lat, me.lon], [far.lat, far.lon]]),
                { padding: [30, 30], maxZoom: 7 });
}

function resetView() { touched = false; fit(); }

function fitSelected() {
  if (!map || !them) return;
  const far = endpoint(me, them);
  const pts = [[far.lat, far.lon]];
  if (me) pts.push([me.lat, me.lon]);
  map.fitBounds(L.latLngBounds(pts), { padding: [35, 35], maxZoom: 7 });
}

// --- setup -------------------------------------------------------------------
function build() {
  const az = wantAzimuthal();
  map = HDMap.create('map', { azimuthal: az, centre: me });
  builtAzimuthal = az;
  builtWithKey = (conf.owm_key || '').trim();

  L_.base = HDMap.basemap(conf).addTo(map);
  L_.station = L.layerGroup().addTo(map);
  L_.logged = L.layerGroup();
  // Its own renderer, on the map from the start. A renderer works out its
  // pixel bounds in onAdd; paths added in the same breath are clipped against
  // bounds that do not exist yet, come out with no geometry, and are never
  // drawn - which showed as a log of contacts with dots but no lines to them.
  L_.loggedCanvas = L.canvas({ padding: 0.3 }).addTo(map);

  space = HDMap.spaceLayers(map, {
    owmKey: builtWithKey,
    report: ({ error, detail }) => {
      if (error !== undefined) $('#err').textContent = error;
      if (detail !== undefined) $('#detail').textContent = detail;
    },
  });
  Object.assign(L_, space.groups);

  // Swept from this station, so it belongs with the overlays rather
  // than with the basemaps.
  L_.area = L.layerGroup();
  map.on('overlayadd overlayremove', (e) => {
    if (e.layer === L_.area) drawArea();
  });
  L.control.layers(null,
                   Object.assign({ 'Logged contacts': L_.logged,
                                   'Band to here (MUF)': L_.area },
                                 space.overlays),
                   { collapsed: true }).addTo(map);

  // A reset control, because "fit the path" is otherwise lost the moment you
  // touch the map.
  HDMap.resetControl(map, resetView);

  map.on('zoomstart movestart', (e) => {
    // Only a human moving the map counts; fit() moves it too.
    if (e.hard !== true) touched = true;
  });
  map.on('overlayadd overlayremove', syncOverlays);
}

function syncOverlays() {
  // Ticking "Logged contacts" is the whole gesture: the layer fetches the log
  // when it is switched on and drops it when it is switched off, so there is
  // nothing to press first and nothing left drawn behind it.
  if (map.hasLayer(L_.logged)) loadLogged();
  else L_.logged.clearLayers();
  space.sync();
  clearInterval(auroraTimer);
  const live = ['aurora', 'drap', 'muf'].filter((n) => map.hasLayer(L_[n]));
  if (live.length) {
    // Everything here is published about every five minutes and cached by the
    // host, so this mostly hits the cache and never hits the source harder
    // than it wants - NOAA resets the connection if you ask too often.
    auroraTimer = setInterval(() => live.forEach((n) => space.draw[n]()), 300000);
  }
}

let builtAzimuthal = false, builtWithKey = '';
let space = null;              // the shared space-weather overlays

function needsRebuild() {
  // Leaflet fixes a map's CRS when it is created, and the layer control is
  // built once, so a projection change or a newly supplied weather key means
  // starting the map again rather than adjusting it.
  return wantAzimuthal() !== builtAzimuthal
      || (conf.owm_key || '').trim() !== builtWithKey;
}

function rebuild() {
  if (map) { map.remove(); map = null; }
  document.getElementById('map').innerHTML = '';
  build();
  drawStation();
  syncOverlays();
  resetView();
}

function applyConf() {
  if (!map) return;
  if (needsRebuild()) { rebuild(); return; }
  if (L_.base) map.removeLayer(L_.base);
  L_.base = HDMap.basemap(conf).addTo(map);
  L_.base.bringToBack?.();
  const want = (name, on) => {
    if (on && !map.hasLayer(L_[name])) map.addLayer(L_[name]);
    if (!on && map.hasLayer(L_[name])) map.removeLayer(L_[name]);
  };
  want('greyline', conf.greyline === true);
  want('aurora', conf.aurora === true);
  // In azimuthal the world has no left or right edge, so framing the whole
  // planet is the only sensible default.
  drawStation();
  syncOverlays();
}

// --- the whole log ----------------------------------------------------------
// The logbook card publishes what it wants plotted; this card decides how it
// looks. Neither has to know the other is on the board.
function plotLogged(stations) {
  L_.logged.clearLayers();
  const esc = (v) => String(v).replace(/[&<>"]/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let shown = 0;
  const bounds = [];
  if (me) bounds.push([me.lat, me.lon]);
  // SVG under a few thousand: Leaflet's canvas renderer only paints the
  // padded viewport, and a marker sitting on that boundary is drawn as the
  // half dot this used to show. SVG has no such edge, and a log of this size
  // is nothing for it.
  const copies = worldCopies();
  // The dots stay SVG while there are not too many of them: Leaflet's canvas
  // renderer only paints the padded viewport, and a marker sitting on that
  // boundary comes out as half a dot. The lines have no such edge to fall
  // foul of and are the bulk of the work - one path of 180 points each, times
  // however many world copies - so they are always on canvas.
  const dots = stations.length * copies.length > 2000
    ? L_.loggedCanvas : undefined;
  stations.forEach((raw) => {
    const home = toLatLon(raw.grid);
    if (!home) return;
    // The dot goes at the end of its own line, which may be in the world copy
    // next door if the path crosses the antimeridian.
    const at = endpoint(me, home);
    const st = raw;
    shown += 1;
    bounds.push([at.lat, at.lon]);
    // A line home, the way the signal went. Thin and translucent so a big log
    // reads as a fan from the station rather than a ball of string.
    if (me) {
      const run = greatCircle(me, at);
      copies.forEach((dx) => {
        L.polyline(run.map(([lat, lon]) => [lat, lon + dx]),
                   { renderer: L_.loggedCanvas, color: THEME.signal,
                     weight: 1, opacity: 0.35,
                     interactive: false }).addTo(L_.logged);
      });
    }
    const when = (st.date || '').length === 8
      ? `${st.date.slice(0, 4)}-${st.date.slice(4, 6)}-${st.date.slice(6, 8)}` : '';
    copies.forEach((dx) => L.circleMarker([at.lat, at.lon + dx], {
      renderer: dots,
      radius: 5, weight: 1.5, color: THEME.bg,
      fillColor: THEME.signal, fillOpacity: 1,
    }).bindTooltip(st.call, { direction: 'top', offset: [0, -4] })
      .bindPopup(`<h3>${HD.flag(st.iso, st.call)}${esc(st.call)}</h3><dl>`
      + `<dt>Grid</dt><dd>${esc(st.grid)}</dd>`
      + (st.band ? `<dt>Band</dt><dd>${esc(st.band)}</dd>` : '')
      + (st.mode ? `<dt>Mode</dt><dd>${esc(st.mode)}</dd>` : '')
      + (when ? `<dt>Date</dt><dd>${esc(when)}</dd>` : '')
      + '</dl>').addTo(L_.logged));
  });
  if (bounds.length) {
    touched = true;               // the operator asked for this framing
    map.fitBounds(L.latLngBounds(bounds), { padding: [25, 25], maxZoom: 6 });
  }
  $('#detail').textContent = `${shown} logged contact${shown === 1 ? '' : 's'} plotted`
    + (shown < stations.length ? ` (${stations.length - shown} had no grid)` : '');
}

async function loadLogged() {
  try {
    const rows = await HD.log.recent(5000);
    plotLogged(rows
      .filter((r) => (r.gridsquare || '').trim())
      .map((r) => ({ call: r.call, grid: r.gridsquare, band: r.band,
                     mode: r.mode, date: r.qso_date, iso: r.iso })));
  } catch (e) { $('#err').textContent = e.message; }
}

// Keep it current while it is showing; ignore it entirely while it is not.
const refreshLoggedIfShowing = () => {
  if (map && map.hasLayer(L_.logged)) loadLogged();
};
HD.on('log.qso_added', refreshLoggedIfShowing);
HD.on('log.qso_deleted', refreshLoggedIfShowing);

// --- state -------------------------------------------------------------------
async function loadMe() {
  try {
    const st = await HD.station();
    const at = toLatLon(st.grid);
    me = at ? { ...at, grid: st.grid, call: st.callsign || 'home' } : null;
    $('#err').textContent = me ? ''
      : 'Your grid is not set — Settings has a "Use my location" button.';
  } catch (e) { $('#err').textContent = e.message; }
}

function show(info) {
  const at = toLatLon(info.locator);
  if (!at) {
    // Leaving the previous station up while the operator is looking at a
    // different callsign is worse than an empty map: a confident wrong answer.
    them = null; lastInfo = null;
    $('#who').textContent = info.callsign || '—';
    $('#detail').textContent = 'no grid known'
      + (info.source ? ` (via ${info.source})` : '');
    drawStation();
    return;
  }
  lastInfo = info;
  them = { ...at, grid: info.locator, call: info.callsign || '' };
  $('#who').innerHTML = HD.flag(info.iso, info.country) + '<span></span>';
  $('#who').querySelector('span').textContent = info.callsign || info.locator;
  const bits = [info.locator, info.country].filter(Boolean);
  if (info.path) {
    bits.push(HD.fmtDistance(info.path.km),
              `${Math.round(info.path.bearing)}° ${HD.bearingName(info.path.bearing)}`);
  }
  if (info.approximate) bits.push('approximate');
  $('#detail').textContent = bits.join(' · ');
  drawStation();
  // While the whole log is on the map, picking a contact is browsing it, so
  // frame the one just chosen even though the view has been touched. Without
  // the log showing, leave a view the operator has moved where they put it.
  if (!touched || map.hasLayer(L_.logged)) fitSelected();
}

HD.on('lookup.result', (p) => { if (p.callsign || p.locator) show(p); });
// hamdash.js applies the theme asynchronously, so the values read at boot can
// be the stylesheet's defaults. Rebuild when it says it has landed.
document.addEventListener('hamdash:units', () => { if (lastInfo) show(lastInfo); });

document.addEventListener('hamdash:theme', () => {
  readTheme();
  if (map) applyConf();
});

HD.on('config.changed', () => {
  // Leaflet baked the old colours into SVG attributes when the layers were
  // made, so a theme change means re-reading the variables and rebuilding
  // them - restyling the document is not enough here.
  readTheme();
  loadMe().then(() => { applyConf(); if (!touched) fit(); });
});
HD.onSettings((v) => { conf = v; applyConf(); resetView(); });

// The greyline moves about a degree every four minutes; once a minute is
// smooth enough and costs nothing.
setInterval(() => { if (map && map.hasLayer(L_.greyline)) space.draw.greyline(); }, 60000);

(async function boot() {
  readTheme();
  conf = await HD.settings();
  build();
  await loadMe();
  // Soundings, bands and absorption, for the path readout. Not awaited
  // into the first paint: the map should not wait on somebody else's
  // server, and the popup is only opened by a click.
  loadProp();
  // Soundings go stale in hours, not minutes.
  setInterval(loadProp, 15 * 60 * 1000);
  applyConf();
  resetView();
})();
</script>
</body>
</html>
