<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  html, body { height: 100%; }
  body { padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
  .bar .spacer { flex: 1; }
  select, button { font: inherit; font-size: 12px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 2px 6px; }
  select { max-width: 15em; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .read { font-family: var(--mono); font-size: 11px; color: var(--muted);
          white-space: nowrap; }
  .read b { color: var(--ink); font-weight: 600; }
  /* Lit only while there is something to hear, so a quiet band and a card
     that has stopped working do not look the same. */
  .ear { width: 8px; height: 8px; border-radius: 50%; background: var(--rule);
         flex: none; }
  .ear.on { background: var(--signal); }
  /* Stopped has to look different from a quiet band. The lamp being dark
     already means "nothing to hear", so a card that has been turned off
     must not look the same as one that is listening to silence. */
  .ear.off { background: var(--alert); opacity: .55; }
  button.run { min-width: 4.4em; }
  /* Lit when RTTY is being read reversed. */
  #rev.on { color: var(--accent); border-color: var(--accent); }
  #rev[hidden] { display: none; }
  button.run.on { color: var(--accent); border-color: var(--accent); }
  /* FT8/FT4: a band a click away, at that mode's usual dial frequency. */
  .tune { display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
          font-size: 12px; }
  .tune[hidden] { display: none; }
  .tune .lbl { color: var(--muted); font-size: 11px; margin-right: 2px; }
  .tune button { padding: 1px 6px; font-family: var(--mono); }
  .tune button.on { color: var(--accent); border-color: var(--accent); }
  body.stopped #out { opacity: .5; }

  #out {
    flex: 1; min-height: 40px; overflow-y: auto; overflow-x: auto;
    font-family: var(--mono); font-size: 15px; line-height: 1.5;
    letter-spacing: 0.06em; color: var(--ink); background: var(--bg);
    border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 6px 8px; white-space: pre-wrap; word-break: break-word;
  }
  #out.nowrap { white-space: pre; word-break: normal; }
  #out:empty::before { content: attr(data-empty); color: var(--muted);
                       font-family: var(--sans, inherit); font-size: 12px; }
  /* What has arrived in the last moment, so the eye can find the live end
     of a block of text that is otherwise all the same. */
  #out .new { color: var(--accent); }
  .err { color: var(--alert); font-size: 12px; margin: 0; }
  /* FT8/FT4: one row per decode, as WSJT-X's band activity reads. */
  #out.slots { white-space: pre; word-break: normal; letter-spacing: 0;
               font-size: 13px; line-height: 1.4; }
  #out .row { display: block; }
  #out .row .m { color: var(--muted); }
  #out .row.cq .t { color: var(--signal); }
  #out .row.osd .t { font-style: italic; }
  #out.slots .row.pickable { cursor: pointer; }
  #out.slots .row.pickable:hover { background: var(--surface-2, rgba(127,127,127,.12)); }
  #out.slots .row.picked { outline: 1px solid var(--accent); outline-offset: -1px; }
  #out .slot-rule { display: block; border-top: 1px solid var(--rule);
                    margin: 2px 0; height: 0; }
  /* FT8/FT4 columns, with a heading row above that says what each is.
     The heading and the rows share one template, so they cannot drift. */
  .cols, #out.slots .row {
    display: grid; column-gap: 1ch; align-items: baseline;
    grid-template-columns: 6ch 3.5ch 4.5ch 4.5ch minmax(0, 1fr) 15ch 8ch;
  }
  /* The widths are in `ch`, which is the element's own font: so the
     heading row has the rows' font and size, and only its labels are made
     small - an 11px heading over 13px rows put "Hz" 14px left of its
     numbers, worse with every column. */
  .cols { font-family: var(--mono); font-size: 13px; color: var(--muted);
          padding: 0 9px 2px; }
  .cols > span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .cols[hidden] { display: none; }
  .cols .num, #out.slots .num { text-align: right; }
  #out.slots .row > span { overflow: hidden; text-overflow: ellipsis; }
  #out.slots .where { color: var(--muted); white-space: nowrap; }
  #out.slots .where img.flag { height: 0.8em; margin-right: 0.4ch;
                               vertical-align: baseline; }
  #out.slots .dist { color: var(--muted); }
  #out.slots .row.pending .where { font-style: italic; }
  /* A narrow tile - or a phone - keeps the decode and where it came from,
     and drops the timing column and the country's name. */
  @media (max-width: 520px) {
    .cols, #out.slots .row {
      grid-template-columns: 6ch 3.5ch 4.5ch minmax(0, 1fr) 7ch 7ch;
    }
    .cols .dt, #out.slots .dt, #out.slots .where .country { display: none; }
  }
</style>
</head>
<body>

<div class="bar">
  <span class="ear" id="ear" title="Lit while a signal is being heard"></span>
  <select id="mode" aria-label="Mode to decode"></select>
  <select id="source" aria-label="Audio input" title="Where the audio comes from"></select>
  <span class="spacer"></span>
  <span class="read" id="read"></span>
  <button id="rev" type="button" hidden
          title="Read RTTY the other way up: mark as the lower tone (LSB) or the higher (USB)">Rev</button>
  <button class="run" id="run" type="button">Stop</button>
  <button id="clear" type="button" title="Empty the window. The speed estimate is kept.">Clear</button>
</div>

<div class="tune" id="tune" hidden role="group" aria-label="Tune the radio to a band"></div>
<div class="cols" id="cols" hidden aria-hidden="true">
  <span title="Start of the slot, UTC">UTC</span>
  <span class="num" title="Signal to noise, in a 2.5 kHz bandwidth">dB</span>
  <span class="num dt" title="Time offset: how late the signal started, seconds. Most stations near one figure means your clock is that far out.">DT</span>
  <span class="num" title="Audio frequency in the receiver's passband, Hz">Hz</span>
  <span title="The message as sent">Message</span>
  <span title="Where the sending station is: state or province, and country">Where</span>
  <span class="num" title="Distance from your station; ~ means only the country is known">Dist</span>
</div>
<div id="out" data-empty="Listening&#8230;"></div>
<p class="err" id="err"></p>

<script src="/static/js/hamdash.js"></script>
<script>
HD.cardId = 'decoder';
const $ = (s) => document.querySelector(s);

/* Who this page is, for as long as it is loaded.
 *
 * The card counts listeners so it knows when to hand the sound card
 * back, and counting them by *tile* makes every browser showing this
 * tile one listener: either one pressing Stop takes the input from the
 * other, whose next poll takes it back. `rx_audio` had the same bug.
 *
 * Not `crypto.randomUUID`: it is secure-context only, and the board is
 * plain HTTP on a LAN address exactly when a second browser is likely,
 * so every page would share the fallback and be one listener again.
 */
const WHO = (() => {
  try {
    const a = new Uint32Array(2);
    crypto.getRandomValues(a);
    return a[0].toString(36) + a[1].toString(36);
  } catch (e) {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
})();

let conf = {};
let revNow = false;       // whether RTTY is being read reversed, as reported
let seq = 0;              // the next character we have not seen
let fading = [];          // spans recently added, to un-highlight
let dseq = 0;             // FT8/FT4: the last decode we have shown
let lastSlot = null;      // FT8/FT4: the slot the last row was from
const SLOT_MODES = ['ft8', 'ft4'];
const slotMode = () => SLOT_MODES.includes(conf.mode);

// ---- quick tune, FT8/FT4 -------------------------------------------------
// The usual dial frequencies (USB, in hertz) - the defaults WSJT-X ships,
// so a click lands where everybody else is. JSON on purpose: the test
// reads this table to check it.
const DIALS = {
  "ft8": {"160": 1840000, "80": 3573000, "60": 5357000, "40": 7074000,
          "30": 10136000, "20": 14074000, "17": 18100000, "15": 21074000,
          "12": 24915000, "10": 28074000, "6": 50313000},
  "ft4": {"80": 3575000, "40": 7047500, "30": 10140000, "20": 14080000,
          "17": 18104000, "15": 21140000, "12": 24919000, "10": 28180000,
          "6": 50318000}
};
let radioNow = null;      // the last radio.state, for lighting the band
let tuneFor = null;       // which mode's buttons are drawn

function paintTune() {
  const box = $('#tune');
  const dials = slotMode() ? DIALS[conf.mode] : null;
  box.hidden = !dials;
  if (!dials) return;
  if (tuneFor !== conf.mode) {
    tuneFor = conf.mode;
    box.textContent = '';
    box.append(Object.assign(document.createElement('span'),
                             { className: 'lbl', textContent: 'Tune' }));
    // Low bands first, as they sit on a radio's band keys.
    for (const [band, hz] of Object.entries(dials).sort((a, b) => a[1] - b[1])) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = `${band}m`;
      b.dataset.hz = String(hz);
      b.title = `${(hz / 1e6).toFixed(hz % 1000 ? 4 : 3)} MHz USB - the usual `
              + `${conf.mode.toUpperCase()} frequency on ${band} m`;
      b.setAttribute('aria-label', `Tune to ${band} metres ${conf.mode.toUpperCase()}`);
      b.onclick = () => tuneTo(hz);
      box.append(b);
    }
  }
  // Lit when the radio is there - within the passband of that dial, where
  // the decodes would come from.
  const f = radioNow && radioNow.ok ? Number(radioNow.freq) : 0;
  box.querySelectorAll('button').forEach((b) => {
    b.classList.toggle('on', !!f && Math.abs(f - Number(b.dataset.hz)) <= 3000);
  });
}

// Mode first, then the frequency (CLAUDE.md, "Mode before frequency"). The
// radio's data mode if it has one - USB-D, DATA-U, PKTUSB - else USB, the
// same choice the spots card makes for a digital spot.
async function tuneTo(hz) {
  $('#err').textContent = '';
  let note = '';
  try { await HD.radio.mode('PKTUSB'); } catch {
    try { await HD.radio.mode('USB'); } catch (e) {
      note = `The mode was left as it was: ${e.message}`;
    }
  }
  try {
    radioNow = await HD.radio.freq(hz);
    paintTune();
  } catch (e) {
    $('#err').textContent = e.message;
    return;
  }
  if (note) $('#err').textContent = note;
}

// Whether this tile is decoding. Kept on the tile, so a card left stopped is
// still stopped tomorrow, and so two tiles can watch different inputs with
// only one of them running.
let running = true;

// Whether to keep the view pinned to the newest text. Pinned until the
// operator scrolls up, because yanking the view back down while somebody is
// reading what was sent a minute ago is worse than them having to scroll.
let pinned = true;

$('#out').addEventListener('scroll', () => {
  const el = $('#out');
  pinned = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
});

function append(text) {
  if (!text) return;
  const el = $('#out');
  const span = document.createElement('span');
  span.className = 'new';
  span.textContent = text;
  el.appendChild(span);
  fading.push([span, Date.now()]);
  if (pinned) el.scrollTop = el.scrollHeight;
}

// The highlight is a hint about what is live, not a permanent colour.
setInterval(() => {
  const now = Date.now();
  fading = fading.filter(([span, at]) => {
    if (now - at < 3000) return true;
    span.classList.remove('new');
    return false;
  });
}, 500);

function cell(cls, text) {
  const c = document.createElement('span');
  if (cls) c.className = cls;
  if (text !== undefined) c.textContent = text;
  return c;
}

// The Where and Dist cells, from what the card knows of the station. Asked
// again later for a US call whose state was still being looked up.
function paintWhere(row, w) {
  const where = row.querySelector('.where');
  const dist = row.querySelector('.dist');
  where.textContent = '';
  dist.textContent = '';
  row.classList.toggle('pending', !!(w && w.pending));
  if (!w) return;
  if (w.iso) where.insertAdjacentHTML('beforeend', HD.flag(w.iso, w.country));
  const place = w.state ? `${w.state}` : '';
  if (place) where.append(place);
  if (w.country) {
    where.append(cell('country', `${place ? ', ' : ''}${w.country}`));
  }
  const hint = [w.state_name && w.state_name !== w.state ? w.state_name : '',
                w.country, w.grid ? `grid ${w.grid}${w.approx ? ' (country centre)' : ''}` : '',
                w.bearing !== null && w.bearing !== undefined ? `beam ${w.bearing}°` : '',
                w.pending ? 'state still being looked up' : '']
    .filter(Boolean).join(' · ');
  where.title = hint;
  dist.dataset.km = w.dist_km === null || w.dist_km === undefined ? '' : String(w.dist_km);
  dist.dataset.approx = w.approx ? '1' : '';
  paintDist(dist);
  row.dataset.call = w.pending ? w.call : '';
}

function paintDist(dist) {
  const km = dist.dataset.km;
  dist.textContent = km === '' || km === undefined ? ''
    : (dist.dataset.approx ? '~' : '') + HD.fmtDistance(Number(km));
}

// A decode line is a station: clicking one looks it up - which is what the
// map cards draw from (lookup.result) - and publishes decoder.picked for
// the logbook. The sender is the station: in "K1ABC W9XYZ R-12" that is
// W9XYZ, and in a CQ the one calling. A hashed call ("<...>") names nobody.
const picks = new WeakMap();
const PICK_CALL = /^(?:[A-Z0-9]{1,4}\/)?[A-Z0-9]{1,3}[0-9][A-Z]{1,4}(?:\/[A-Z0-9]{1,4})?$/;
const pickable = (r) => !!r.call && PICK_CALL.test(r.call);

async function pick(row, r) {
  $('#out').querySelectorAll('.row.picked').forEach((x) => x.classList.remove('picked'));
  row.classList.add('picked');
  const dial = radioNow && radioNow.ok ? Number(radioNow.freq) : 0;
  const p = {
    call: r.call, grid: r.grid || '', snr: r.snr,
    mode: conf.mode.toUpperCase(), slot: r.slot,
    rf_hz: dial ? Math.round(dial + Number(r.freq)) : null,
  };
  HD.publish('decoder.picked', p).catch(() => {});
  try {
    const q = p.grid ? `?grid=${encodeURIComponent(p.grid)}` : '';
    await HD.get(`/api/lookup/${encodeURIComponent(p.call)}${q}`);
  } catch (e) { /* the pick still reaches the logbook */ }
}

$('#out').addEventListener('click', (e) => {
  const row = e.target.closest('.row.pickable');
  if (row && picks.has(row)) pick(row, picks.get(row));
});

function appendRows(rows) {
  const el = $('#out');
  for (const r of rows) {
    if (lastSlot !== null && r.slot !== lastSlot) {
      el.appendChild(Object.assign(document.createElement('span'),
                                   { className: 'slot-rule' }));
    }
    lastSlot = r.slot;
    const row = document.createElement('span');
    row.className = 'row new' + (r.to === 'CQ' || /^CQ /.test(r.text) ? ' cq' : '')
                  + (r.osd || r.ap ? ' osd' : '');
    const t = new Date(r.slot * 1000).toISOString();
    const hms = t.slice(11, 13) + t.slice(14, 16) + t.slice(17, 19);
    const sign = (v) => (v >= 0 ? '+' : '') + v;
    const txt = cell('t', r.text);
    if (r.osd) txt.title = 'Found by the slower, less certain decoder (OSD)';
    if (r.ap) {
      txt.title = r.ap === 'a2'
        ? 'a2: decoded expecting a message to your callsign'
        : 'a1: decoded expecting a CQ';
      txt.append(cell('m', ` ${r.ap}`));
    }
    row.append(cell('m', hms), cell('m num', sign(r.snr)),
               cell('m num dt', sign(r.dt.toFixed(1))),
               cell('m num', String(Math.round(r.freq))), txt,
               cell('where'), cell('dist num'));
    paintWhere(row, r.where);
    if (pickable(r)) {
      row.classList.add('pickable');
      row.title = `${r.call}: look up, show on the map, and fill the logbook`;
      picks.set(row, r);
    }
    el.appendChild(row);
    fading.push([row, Date.now()]);
  }
  // A busy band is forty rows a slot: keep the window to a few hundred.
  while (el.childNodes.length > 600) el.removeChild(el.firstChild);
  if (rows.length && pinned) el.scrollTop = el.scrollHeight;
}

function readout(d) {
  $('#ear').classList.toggle('on', !!d.hearing);
  const bits = [];
  if (SLOT_MODES.includes(d.mode)) {
    if (d.last_slot) {
      bits.push(`<b>${d.last_count}</b> decoded`);
      if (d.last_ms !== null && d.last_ms !== undefined) {
        bits.push(`${(d.last_ms / 1000).toFixed(1)} s`);
      }
    } else {
      bits.push('waiting for a slot');
    }
    if (d.median_dt !== null && d.median_dt !== undefined) {
      bits.push(`DT <b>${d.median_dt >= 0 ? '+' : ''}${d.median_dt.toFixed(1)}</b>`);
    }
  } else if (d.mode === 'rtty') {
    if (d.mark_hz) bits.push(`M <b>${Math.round(d.mark_hz)}</b>`
                             + ` S ${Math.round(d.space_hz)} Hz`);
  } else if (d.mode === 'psk31') {
    // The carrier to a tenth: PSK31 is 60 Hz wide, so where it sits is
    // the useful number, and the AFC moving it is worth seeing.
    if (d.tone_hz) bits.push(`<b>${d.tone_hz.toFixed(1)}</b> Hz`);
  } else {
    if (d.wpm) bits.push(`<b>${d.wpm}</b> wpm`);
    if (d.tone_hz) bits.push(`${Math.round(d.tone_hz)} Hz`);
  }
  if (d.snr_db && !SLOT_MODES.includes(d.mode)) {
    bits.push(`${Math.round(d.snr_db)} dB`);
  }
  $('#read').innerHTML = bits.join(' · ');
  const rev = $('#rev');
  rev.hidden = d.mode !== 'rtty';
  rev.classList.toggle('on', !!d.reverse);
  revNow = !!d.reverse;
  // A pair found and nothing printing is nearly always the polarity: read
  // the wrong way up, mark is the start bit and nothing frames. Saying so
  // beats a lit lamp over an empty window.
  let hint = '';
  if (d.mode === 'rtty' && d.hearing && running
      && (d.quiet_for === null || d.quiet_for > 8)) {
    hint = 'Hearing RTTY but nothing frames - try Rev, or the stop bits.';
  }
  if (d.mode === 'psk31' && d.tone_hz && running && !d.hearing
      && (d.quiet_for === null || d.quiet_for > 8)) {
    hint = 'Locked on a PSK31 carrier, but its symbols are not clear - '
         + 'too weak, or another signal on top of it.';
  }
  if (SLOT_MODES.includes(d.mode) && running) {
    // Everybody late by the same amount is this computer's clock, not
    // the band. WSJT-X decodes to about +-2 s and so does this, but the
    // margin is gone long before that.
    if (d.median_dt !== null && Math.abs(d.median_dt) >= 0.5) {
      hint = `Stations are arriving ${Math.abs(d.median_dt).toFixed(1)} s `
           + (d.median_dt > 0 ? 'late' : 'early')
           + ' on average - is this computer\'s clock right? (NTP)';
    } else if (d.dropped) {
      hint = `${d.dropped} slot${d.dropped === 1 ? '' : 's'} skipped - audio`
           + ' was interrupted, or decoding could not keep up.';
    }
  }
  $('#err').textContent = d.error || hint;
}

function paintRun() {
  document.body.classList.toggle('stopped', !running);
  $('#ear').classList.toggle('off', !running);
  if (!running) $('#ear').classList.remove('on');
  const b = $('#run');
  b.textContent = running ? 'Stop' : 'Start';
  b.classList.toggle('on', !running);
  b.title = running ? 'Stop decoding and give the sound card back'
                    : 'Start decoding';
  applyWrap();
  if (!running) {
    $('#read').textContent = 'stopped';
    $('#err').textContent = '';
  }
}

async function setRunning(on, { save = true } = {}) {
  running = on;
  paintRun();
  if (on) {
    seq = 0;                 // a restarted listener counts from zero again
    dseq = 0;
    tick();
  } else {
    // Say so rather than just going quiet. The card would work it out from
    // the polling stopping, but half a minute later, and the usual reason to
    // press Stop is to hand the sound card to another program now.
    try { await HD.card('decoder', `/api/stop?who=${WHO}`, {}); } catch { /* the
      reaper will get there eventually */ }
  }
  if (save) {
    conf = { ...conf, running: on };
    try { await HD.saveSettings(conf); } catch { /* it applies now anyway */ }
  }
}

async function tickSlots() {
  let d;
  try {
    d = await HD.card('decoder', `/api/decodes?since=${dseq}&who=${WHO}`);
  } catch (e) {
    $('#err').textContent = e.message;
    return;
  }
  readout(d);
  if (d.status === 'idle') { dseq = 0; return; }
  if (d.dseq < dseq) dseq = 0;          // the card restarted under us
  const rows = d.decodes || [];
  if (rows.length) {
    appendRows(rows);
    dseq = rows[rows.length - 1].seq;
  }
}

// US states arrive a little after their rows: the card looks them up one
// at a time so as not to lean on a free lookup service. Every few seconds
// the rows still waiting are asked about again.
async function refreshPlaces() {
  if (!slotMode() || HD.hidden) return;
  const waiting = [...document.querySelectorAll('#out .row.pending')];
  const calls = [...new Set(waiting.map((r) => r.dataset.call).filter(Boolean))];
  if (!calls.length) return;
  let got;
  try {
    got = await HD.card('decoder', `/api/places?calls=${encodeURIComponent(calls.slice(0, 60).join(','))}`);
  } catch { return; }
  for (const row of waiting) {
    const w = (got.places || {})[row.dataset.call];
    if (w && !w.pending) paintWhere(row, w);
  }
}
setInterval(refreshPlaces, 4000);

// Distances are formatted in the operator's units; when those change, the
// rows already on screen change with them.
document.addEventListener('hamdash:units', () => {
  document.querySelectorAll('#out .dist').forEach(paintDist);
});

async function tick() {
  if (!running) return;
  // FT8 and FT4 go on decoding out of sight; the other modes do not. See
  // the visibility handler below for why.
  if (slotMode()) return tickSlots();
  if (HD.hidden) return;
  let d;
  try {
    d = await HD.card('decoder', `/api/text?since=${seq}&who=${WHO}`);
  } catch (e) {
    $('#err').textContent = e.message;
    return;
  }
  readout(d);
  if (d.status === 'idle') {
    seq = 0;
    return;
  }
  // `first` is where the card's history actually starts. Behind it means we
  // have been away longer than the card keeps text, and saying so beats a
  // silent gap in the middle of somebody's over.
  if (d.first > seq && seq !== 0) {
    append('\n[…missed]\n');
  }
  if (d.text) {
    append(d.text);
    seq = d.first + d.text.length;
  } else if (d.seq < seq) {
    seq = d.seq;                       // the window was cleared under us
  }
}

async function fillLists() {
  let env = { inputs: [], modes: [] };
  try {
    env = await HD.card('decoder', '/api/inputs');
  } catch { /* the selects stay as they are */ }
  $('#mode').innerHTML = (env.modes || []).map((m) =>
    `<option value="${m.id}"${m.ready ? '' : ' disabled'}>`
    + `${m.name}${m.ready ? '' : ' — not built yet'}</option>`).join('');
  $('#mode').value = conf.mode || 'cw';
  $('#source').innerHTML = (env.inputs || []).map((i) =>
    `<option value="${i.id}">${i.name}</option>`).join('');
  const want = conf.source || 'mock';
  if (![...$('#source').options].some((o) => o.value === want)) {
    // A device that is saved but not present - unplugged, or this layout
    // came from another machine. Kept and shown, rather than silently
    // becoming whatever happens to be first in the list.
    $('#source').insertAdjacentHTML('beforeend',
      `<option value="${want}">${want} (not connected)</option>`);
  }
  $('#source').value = want;
}

function applyWrap() {
  $('#out').classList.toggle('nowrap', conf.wrap === false);
  $('#out').classList.toggle('slots', slotMode());
  $('#cols').hidden = !slotMode();
  paintTune();
  $('#out').dataset.empty = !running ? 'Stopped'
    : slotMode() ? `Listening - decodes appear as each ${conf.mode === 'ft4' ? '7.5' : '15'} s slot ends`
    : 'Listening…';
}

$('#run').onclick = () => setRunning(!running);

// Behind another tab, CW, RTTY and PSK31 give the sound card back - the
// same release Stop does, without changing what Stop is set to, so coming
// back resumes rather than needing a press. Their output is text somebody
// reads, so out of sight they have no job, and holding the radio's audio
// against WSJT-X for that would be the wrong trade.
// FT8 and FT4 do not stop. Their decodes have readers that are not this
// page - the PSK Reporter card's map and the uploader - and on a phone, where
// only one card is on screen, looking at that map is exactly when this tile
// is hidden. Stop is still the way to let the input go.
HD.onVisible((on) => {
  if (!running || slotMode()) return;
  if (on) { seq = 0; dseq = 0; tick(); }
  else HD.card('decoder', `/api/stop?who=${WHO}`, {}).catch(() => {});
});

$('#clear').onclick = async () => {
  try {
    const r = await HD.card('decoder', `/api/clear?who=${WHO}`, {});
    $('#out').textContent = '';
    fading = [];
    pinned = true;
    seq = r.seq || 0;
    lastSlot = null;
  } catch (e) { $('#err').textContent = e.message; }
};

function decoderOf(c) {
  return [c.mode || 'cw', c.reverse || 'auto', c.usos !== false,
          c.stop_bits || '1.5'].join('|');
}

// Each mode has its own text on the card, counted from its own zero, so the
// window starts again rather than splicing two decoders' output together.
function restartText() {
  $('#out').textContent = '';
  fading = [];
  seq = 0;
  dseq = 0;
  lastSlot = null;
  applyWrap();
}

$('#mode').onchange = async () => {
  conf = { ...conf, mode: $('#mode').value };
  restartText();
  try { await HD.saveSettings({ mode: conf.mode }); } catch { /* it applies now anyway */ }
};

// The quickest fix there is for RTTY that will not read, so it is on the
// tile rather than in the settings sheet. Explicit, not auto: pressing it
// means "the other way from what you are doing now".
$('#rev').onclick = async () => {
  conf = { ...conf, reverse: revNow ? 'normal' : 'reversed' };
  restartText();
  try { await HD.saveSettings({ reverse: conf.reverse }); } catch { /* as above */ }
};

$('#source').onchange = async () => {
  // Let go of the old input before taking the new one: two inputs open for
  // one tile is one sound card nobody else can have.
  if (running) {
    try { await HD.card('decoder', `/api/stop?who=${WHO}`, {}); } catch { /* ignore */ }
  }
  conf = { ...conf, source: $('#source').value };
  $('#out').textContent = '';
  seq = 0;
  try { await HD.saveSettings(conf); } catch { /* as above */ }
  if (running) tick();
};

// The radio's audio input can change without this tile being touched -
// another card switching rigs, or the setting being edited - and "Radio's
// audio in" has to follow it rather than keep the device it started with.
// Only when what the lists show could have changed - which radio, or its
// sound card. Every tuning step is a radio.state, and rebuilding both
// selects on each one cost a host round trip and closed a select the
// operator had open.
let listsFor = null;
HD.on('radio.state', (s) => {
  radioNow = s;
  paintTune();
  const key = `${s && s.rig_id}|${s && s.audio_in}`;
  if (key === listsFor) return;
  listsFor = key;
  fillLists();
});

(async function boot() {
  try { conf = await HD.settings(); } catch { /* defaults will do */ }
  // The radio is announced on change only, so ask once: without it the
  // band buttons stay dark until somebody next turns the dial.
  HD.radio.state().then((s) => { radioNow = s; paintTune(); }).catch(() => {});
  HD.onSettings((v) => {
    // A different decoder is a different text, whichever control chose it.
    const was = decoderOf(conf);
    conf = v || {};
    if (decoderOf(conf) !== was) restartText();
    applyWrap();
    fillLists();
    // The settings sheet can turn it off too, and the tile has to follow.
    if (conf.running !== undefined && !!conf.running !== running) {
      setRunning(!!conf.running, { save: false });
    }
  });
  applyWrap();
  await fillLists();
  running = conf.running !== false;
  paintRun();
  tick();
  // Twice a second. A character at 20 WPM takes about half of that, so the
  // text arrives looking live without polling for the sake of it.
  setInterval(tick, 500);
})();
</script>
</body>
</html>
