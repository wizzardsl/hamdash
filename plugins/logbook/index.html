<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/css/app.css">
<style>
  body { padding: 10px; overflow: auto; }
  .entry { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; }
  .entry label { font-size: 11px; color: var(--muted); display: block; }
  .entry input { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--rule); border-radius: var(--radius); padding: 4px 6px; }
  .entry input.mono { font-family: var(--mono); }
  .actions { display: flex; gap: 6px; margin: 10px 0; align-items: center; }
  .found { color: var(--muted); font-size: 12px; }
  .found b { color: var(--accent); font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--rule); padding: 4px 4px; }
  td { padding: 3px 4px; border-bottom: 1px solid var(--rule); }
  td.c { font-family: var(--mono); color: var(--accent); }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--panel-2); }
  tbody tr.on td { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
  .row-acts { white-space: nowrap; }
  .del, .eye { border: 0; background: none; color: var(--muted); cursor: pointer;
               padding: 0 3px; font-size: 13px; }
  .eye:hover { color: var(--accent); }
  .del:hover { color: var(--alert); }
  .err { color: var(--alert); font-size: 12px; }

  /* What is known about the station being typed, before it is logged. */
  .peek {
    border: 1px solid var(--rule); border-left: 3px solid var(--accent);
    border-radius: var(--radius); background: var(--panel-2);
    padding: 7px 10px; margin: 0 0 8px;
  }
  .peek[hidden] { display: none; }
  .peek-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .peek-call { font-family: var(--mono); font-size: 16px; color: var(--accent); }
  .peek-name { font-size: 14px; }
  .peek-dist { margin-left: auto; font-family: var(--mono); font-size: 15px; }
  .peek-sub {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    margin-top: 4px; font-size: 12px; color: var(--muted);
  }
  .peek-sub .mono, .peek-brg { font-family: var(--mono); }
  .peek-worked, .peek-notes { display: flex; align-items: center; gap: 5px; }
  .peek-view { font-size: 11px; padding: 1px 6px; }
  .peek-note { margin-top: 4px; font-size: 11px; color: var(--muted); }
  .peek-note.warn { color: var(--alert); }
  .worked-list { margin: 0; padding: 0; list-style: none; font-size: 13px; }
  .worked-list li { padding: 4px 0; border-bottom: 1px solid var(--rule); }
  .worked-list .when { font-family: var(--mono); color: var(--muted); }
  .worked-list .said { display: block; margin-top: 2px; }

  .tools { display: flex; gap: 6px; align-items: center; margin: 0 0 8px; }
  .tools #q { flex: 1; min-width: 0; font: inherit; font-family: var(--mono);
    color: var(--ink); background: var(--bg); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 4px 7px; }
  .tools .btn { font-size: 12px; padding: 4px 9px; }
  .tools #page-size {
    font: inherit; font-size: 12px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--rule);
    border-radius: 6px; padding: 4px 6px;
  }
  .pager {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    margin: 8px 0 2px; color: var(--muted); font-size: 12px;
  }
  .pager .btn { font-size: 13px; padding: 2px 10px; line-height: 1.4; }
  .pager .btn[disabled] { opacity: 0.35; cursor: default; }
  .pg-at { font-variant-numeric: tabular-nums; }
  .cols-wrap { position: relative; }
  .cols { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20;
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 6px 9px; white-space: nowrap;
    box-shadow: 0 8px 22px rgba(0,0,0,.4); }
  .cols[hidden] { display: none; }
  .cols label { display: flex; align-items: center; gap: 6px; padding: 2px 0;
    font-size: 12px; cursor: pointer; }
  tr.day td { color: var(--muted); font-size: 12px; padding-top: 10px;
    border-bottom: 1px solid var(--accent); }
  th.num, td.num { text-align: right; }
  td.conf.yes { color: var(--signal); }
  td.conf.part { color: var(--accent); }
  .sync { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
          margin: 8px 0 2px; font-size: 12px; }
  .sync[hidden] { display: none; }
  .sync-label { color: var(--muted); }
  .sync-svc { display: flex; align-items: center; gap: 5px; }
  .sync-svc[hidden] { display: none; }
  .sync-svc .btn { font-size: 12px; padding: 3px 7px; }
  .sync-name { color: var(--muted); font-family: var(--mono); }
  .sync-svc label { display: flex; align-items: center; gap: 3px; color: var(--muted); }
  .sync-state { color: var(--muted); }
  .sync-state.warn { color: var(--alert); }
  .sync-state.good { color: var(--signal); }
  .qso-dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px;
            margin: 0; max-height: 60vh; overflow: auto; font-size: 13px; }
  .qso-dl dt { color: var(--muted); }
  .qso-dl dd { margin: 0; font-family: var(--mono); word-break: break-word; }
</style>
</head>
<body>

<div class="entry">
  <div><label for="f-call">Callsign</label><input id="f-call" class="mono" spellcheck="false"></div>
  <div><label for="f-sent">Sent</label><input id="f-sent" class="mono" value="59"></div>
  <div><label for="f-rcvd">Received</label><input id="f-rcvd" class="mono" value="59"></div>
  <div><label for="f-grid">Grid</label><input id="f-grid" class="mono" spellcheck="false"></div>
  <div><label for="f-band">Band</label><input id="f-band" class="mono"></div>
  <div><label for="f-mode">Mode</label><input id="f-mode" class="mono"></div>
  <div><label for="f-comment">Comment</label><input id="f-comment"></div>
</div>

<div class="actions">
  <button class="btn" id="save">Log it</button>
  <button class="btn btn-quiet" id="adif">Export ADIF</button>
  <button class="btn btn-quiet" id="import" title="Read a .adi or .adif file into the log. Contacts already here are updated, not duplicated.">Import ADIF</button>
  <input type="file" id="import-file" accept=".adi,.adif,.txt" hidden>
  <span class="found" id="found"></span>
</div>
<p class="err" id="err"></p>

<div class="tools">
  <input id="q" class="mono" placeholder="Search by callsign" spellcheck="false">
  <button class="btn btn-quiet" id="q-clear">Clear</button>
  <div class="cols-wrap">
    <button class="btn btn-quiet" id="cols-btn" aria-expanded="false">Columns</button>
    <div class="cols" id="cols" hidden></div>
  </div>
  <select id="page-size" aria-label="Contacts per page">
    <option value="10">10</option>
    <option value="25">25</option>
    <option value="30" selected>30</option>
    <option value="50">50</option>
    <option value="100">100</option>
    <option value="250">250</option>
    <option value="0">All</option>
  </select>
</div>

<div class="peek" id="peek" hidden>
  <div class="peek-top">
    <span class="peek-call" id="peek-call"></span>
    <span class="peek-name" id="peek-name"></span>
    <span class="peek-dist" id="peek-dist"></span>
  </div>
  <div class="peek-sub">
    <span class="peek-where" id="peek-where"></span>
    <span class="peek-brg" id="peek-brg"></span>
    <span class="peek-worked">
      <span id="peek-qsos">no QSOs</span>
      <button class="btn btn-quiet peek-view" id="peek-qsos-view" hidden>View</button>
    </span>
    <span class="peek-notes">
      <span id="peek-notes-n">no notes</span>
      <button class="btn btn-quiet peek-view" id="peek-notes-view" hidden>View</button>
    </span>
  </div>
  <div class="peek-note" id="peek-note"></div>
</div>

<table>
  <thead><tr id="log-head"></tr></thead>
  <tbody id="rows"></tbody>
</table>

<div class="pager" id="pager" hidden>
  <button class="btn btn-quiet" id="pg-prev" title="Newer contacts">‹</button>
  <span class="pg-at" id="pg-at"></span>
  <button class="btn btn-quiet" id="pg-next" title="Older contacts">›</button>
</div>

<dialog id="qso-sheet" class="sheet">
  <h2 id="qso-title">Contact</h2>
  <dl id="qso-rows" class="qso-dl"></dl>
  <footer class="sheet-foot">
    <button class="btn" id="qso-close">Done</button>
  </footer>
</dialog>

<div class="sync" id="sync" hidden>
  <span class="sync-label">Sync</span>
  <span class="sync-svc" id="sync-lotw" hidden>
    <span class="sync-name">LoTW</span>
    <button class="btn btn-quiet" data-pull="lotw" title="Fetch from LoTW. Nothing is duplicated: a contact already in the log is updated, not added again.">Pull</button>
    <button class="btn btn-quiet" data-push="lotw">Push</button>
    <label title="Upload new contacts and pull changes every minute. Only one service at a time."><input type="checkbox" data-auto="lotw"> auto</label>
  </span>
  <span class="sync-svc" id="sync-qrz" hidden>
    <span class="sync-name">QRZ</span>
    <button class="btn btn-quiet" data-pull="qrz" title="Fetch from QRZ. Nothing is duplicated: a contact already in the log is updated, not added again.">Pull</button>
    <button class="btn btn-quiet" data-push="qrz">Push</button>
    <label title="Upload new contacts and pull changes every minute. Only one service at a time."><input type="checkbox" data-auto="qrz"> auto</label>
  </span>
  <span class="sync-state" id="sync-state"></span>
</div>

<script src="/static/js/hamdash.js"></script>
<script>
HD.cardId = 'logbook';
const $ = (s) => document.querySelector(s);
let lookupTimer;
let conf = {};

// Something shaped like a callsign: an optional portable prefix, a prefix, a
// digit, a suffix. Typing VE7STV used to look up VE7, VE7S, VE7ST and VE7STV
// - four provider calls for one contact, plus one for every typo on the way -
// and the services rate-limit and then lock an account for exactly that.
const CALLSIGN = /^(?:[A-Z0-9]{1,4}\/)?[A-Z0-9]{1,3}[0-9][A-Z]{1,4}(?:\/[A-Z0-9]{1,4})?$/;
let lookedUp = '';

function maybeLookup(call, now) {
  clearTimeout(lookupTimer);
  if (!CALLSIGN.test(call)) { $('#found').textContent = ''; hidePeek(); return; }
  if (call === lookedUp) return;
  // Long enough that an ordinary typist finishes the callsign first, so only
  // the whole thing is looked up rather than every prefix of it.
  lookupTimer = setTimeout(() => { lookedUp = call; prefill(call); },
                           now ? 0 : 700);
}

$('#f-call').addEventListener('input', (e) => {
  const call = e.target.value.trim().toUpperCase();
  e.target.value = call;
  maybeLookup(call, false);
});
// Leaving the field says you have finished typing, so don't sit on the timer.
$('#f-call').addEventListener('blur', (e) => {
  maybeLookup(e.target.value.trim().toUpperCase(), true);
});

async function prefill(call) {
  try {
    const { qso, info } = await HD.card('logbook', `/api/prefill/${call}`);
    ['grid:gridsquare', 'band:band', 'mode:mode'].forEach((pair) => {
      const [field, key] = pair.split(':');
      if (!$(`#f-${field}`).value && qso[key]) $(`#f-${field}`).value = qso[key];
    });
    showPeek(call, info);
  } catch (e) { $('#err').textContent = e.message; }
}

// ---- what is known about the station being typed ---------------------------
// Filled from the same lookup that prefills the form, so it costs nothing
// extra, and it appears while the QSO is still in progress - which is when
// knowing you have worked somebody before is actually useful.
let peekWorked = [], peekCall = '';

function showPeek(call, info) {
  peekCall = call;
  peekWorked = info.worked_before || [];
  $('#peek').hidden = false;

  $('#peek-call').textContent = call;
  $('#peek-name').textContent = info.name || '';

  const where = [info.country, info.state].filter(Boolean).join(' · ');
  $('#peek-where').innerHTML = HD.flag(info.iso, info.country) + '<span></span>';
  $('#peek-where').querySelector('span').textContent = where || 'unknown';

  if (info.path) {
    $('#peek-dist').textContent = `↔ ${HD.fmtDistance(info.path.km)}`;
    $('#peek-brg').textContent =
      `⦾ ${Math.round(info.path.bearing)}° ${HD.bearingName(info.path.bearing)}`;
  } else {
    $('#peek-dist').textContent = '';
    $('#peek-brg').textContent = info.locator ? '' : 'no grid known';
  }

  const n = peekWorked.length;
  $('#peek-qsos').textContent = n ? `${n} QSO${n === 1 ? '' : 's'}` : 'first contact';
  $('#peek-qsos-view').hidden = !n;

  const notes = peekWorked.filter((q) => (q.comment || '').trim());
  $('#peek-notes-n').textContent = notes.length
    ? `${notes.length} note${notes.length === 1 ? '' : 's'}` : 'no notes';
  $('#peek-notes-view').hidden = !notes.length;

  const note = $('#peek-note');
  // Say where it came from, and say when it is a guess: the prefix table
  // answers with the middle of a country and that is not a location.
  note.className = 'peek-note' + (info.approximate ? ' warn' : '');
  note.textContent = info.note ? info.note
    : info.approximate ? `no record for ${call}; showing the ${info.country || 'prefix'} guess`
    : info.source ? `via ${info.source}${info.locator ? ' · ' + info.locator : ''}`
    : '';
}

function hidePeek() { $('#peek').hidden = true; }

function whenOf(q) {
  const d = q.qso_date || '';
  const t = (q.time_on || '').slice(0, 4);
  return d.length === 8
    ? `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)} ${t}` : t;
}

function listSheet(title, items) {
  $('#qso-title').textContent = title;
  const dl = $('#qso-rows');
  dl.innerHTML = '';
  const ul = document.createElement('ul');
  ul.className = 'worked-list';
  items.forEach((q) => {
    const li = document.createElement('li');
    const when = document.createElement('span');
    when.className = 'when';
    when.textContent = [whenOf(q), q.band, q.mode,
                        q.freq ? `${Number(q.freq).toFixed(3)} MHz` : '',
                        q.rst_sent ? `${q.rst_sent}/${q.rst_rcvd}` : '']
      .filter(Boolean).join('  ');
    li.appendChild(when);
    if ((q.comment || '').trim()) {
      const said = document.createElement('span');
      said.className = 'said';
      said.textContent = q.comment;
      li.appendChild(said);
    }
    ul.appendChild(li);
  });
  dl.appendChild(ul);
  $('#qso-sheet').showModal();
}

$('#peek-qsos-view').onclick = () =>
  listSheet(`${peekCall} · previous contacts`, peekWorked);
$('#peek-notes-view').onclick = () =>
  listSheet(`${peekCall} · notes`,
            peekWorked.filter((q) => (q.comment || '').trim()));

async function select(qso, tr) {
  document.querySelectorAll('#rows tr.on').forEach((n) => n.classList.remove('on'));
  if (tr) tr.classList.add('on');
  // Put the callsign where you would have typed it. Clicking a contact and
  // then wanting to work them again is the common case, and it is the same
  // panel either way - so there is no reason for the click to show less than
  // typing the callsign would.
  $('#f-call').value = qso.call;
  lookedUp = qso.call;                 // already looked up below; don't re-ask
  try {
    // Prefer the grid that was logged: it is what was actually worked.
    const info = await HD.get(`/api/lookup/${encodeURIComponent(qso.call)}`,
                              qso.gridsquare ? { grid: qso.gridsquare } : undefined);
    const bits = [qso.call];
    if (info.locator) bits.push(info.locator);
    if (info.path) bits.push(`${HD.fmtDistance(info.path.km)} at `
                             + `${Math.round(info.path.bearing)}°`);
    $('#found').innerHTML = HD.flag(info.iso, info.country)
      + `<b>${qso.call}</b> · ${bits.slice(1).join(' · ')}`;
    // One request serves both: the summary line and the station panel.
    showPeek(qso.call, info);
    $('#err').textContent = '';
  } catch (e) { $('#err').textContent = e.message; }
}

$('#save').onclick = async () => {
  const qso = {
    call: $('#f-call').value, rst_sent: $('#f-sent').value,
    rst_rcvd: $('#f-rcvd').value, gridsquare: $('#f-grid').value,
    band: $('#f-band').value, mode: $('#f-mode').value,
    comment: $('#f-comment').value,
  };
  try {
    const full = await HD.card('logbook', `/api/prefill/${qso.call || 'X'}`);
    await HD.card('logbook', '/api/save', { ...full.qso, ...clean(qso) });
    ['#f-call', '#f-grid', '#f-comment'].forEach((s) => { $(s).value = ''; });
    $('#found').textContent = '';
    hidePeek();
    $('#err').textContent = '';
    refresh();
  } catch (e) { $('#err').textContent = e.message; }
};

const clean = (o) => Object.fromEntries(Object.entries(o).filter(([, v]) => v));

$('#adif').onclick = () => { window.location = '/api/log/adif'; };

// ---- import a file --------------------------------------------------------
// Same importer the syncs use, so the same dedupe applies: a contact already
// in the log is updated with anything the file knows and this one doesn't,
// never added twice. Importing the same file again reports nothing new.
$('#import').onclick = () => $('#import-file').click();
$('#import-file').onchange = async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  $('#err').textContent = '';
  $('#found').textContent = `reading ${file.name}…`;
  try {
    const text = await file.text();
    const r = await HD.postText('/api/log/adif', text);
    $('#found').innerHTML = `<b>${file.name}</b> · ${r.added} added, `
      + `${r.updated} updated, ${r.skipped} already had`;
    refresh();
  } catch (err) {
    $('#err').textContent = err.message;
  } finally {
    e.target.value = '';          // so the same file can be chosen again
  }
};

// ---- every field of one contact -------------------------------------------
// The table shows what you scan; this shows what was actually recorded,
// including whatever a sync brought back.
const LABELS = {
  call: 'Callsign', qso_date: 'Date', time_on: 'Time on', time_off: 'Time off',
  freq: 'Frequency (MHz)', band: 'Band', mode: 'Mode',
  rst_sent: 'RST sent', rst_rcvd: 'RST received', gridsquare: 'Grid',
  name: 'Name', qth: 'QTH', country: 'Country', comment: 'Comment',
  tx_pwr: 'Power (W)', my_callsign: 'My callsign', my_gridsquare: 'My grid',
  qsl_sent: 'QSL sent', qsl_rcvd: 'QSL received',
  qslsdate: 'QSL sent on', qslrdate: 'QSL received on',
  lotw_qsl_sent: 'LoTW sent', lotw_qsl_rcvd: 'LoTW confirmed',
  eqsl_qsl_rcvd: 'eQSL confirmed', dxcc: 'DXCC', state: 'State',
  cnty: 'County', cqz: 'CQ zone', ituz: 'ITU zone', id: 'Record',
};

function showDetails(qso) {
  $('#qso-title').innerHTML = HD.flag(qso.iso, qso.call) + '<span></span>';
  $('#qso-title').querySelector('span').textContent = qso.call || 'Contact';
  const dl = $('#qso-rows');
  dl.innerHTML = '';
  Object.keys(LABELS).forEach((k) => {
    const v = qso[k];
    if (v === undefined || v === null || String(v).trim() === '') return;
    const dt = document.createElement('dt');
    dt.textContent = LABELS[k];
    const dd = document.createElement('dd');
    dd.textContent = String(v);
    dl.append(dt, dd);
  });
  $('#qso-sheet').showModal();
}
$('#qso-close').onclick = () => $('#qso-sheet').close();

// Plotting the log lives in the map card now: it is the card that draws it,
// so it is the card that fetches it. A button here that pushed data at a card
// which might not even be on the board was a second way to do one thing.

// ---- sync -----------------------------------------------------------------
// The buttons exist only for a service that is actually set up. An auto
// toggle uploads what has been logged since the last upload and then pulls,
// once a minute.
const autoTimers = {};

function syncState(msg, kind) {
  const n = $('#sync-state');
  n.textContent = msg || '';
  n.className = 'sync-state' + (kind ? ` ${kind}` : '');
}

async function refreshSync() {
  try {
    const s = await HD.get('/api/log/sync');
    let any = false;
    [['lotw', s.lotw], ['qrz', s.qrz]].forEach(([name, svc]) => {
      // LoTW can be set up for pulling and still not be able to push, because
      // only TQSL can sign an upload. Hiding the button is more honest than
      // offering one that always fails.
      const canPush = name === 'lotw' ? (svc.configured && svc.can_push)
                                      : svc.configured;
      $(`#sync-${name}`).hidden = !canPush;
      if (canPush) {
        any = true;
        const b = document.querySelector(`[data-push="${name}"]`);
        b.textContent = svc.pending
          ? `Push ${name.toUpperCase()} (${svc.pending})`
          : `Push ${name.toUpperCase()}`;
        b.disabled = !svc.pending;
      }
    });
    $('#sync').hidden = !any;
  } catch { /* the panel just stays hidden */ }
}

async function pushNew(name, quiet) {
  try {
    if (!quiet) syncState(`pushing to ${name.toUpperCase()}…`);
    await HD.post(`/api/log/sync/${name}/push`, { new_only: true, dry_run: false });
  } catch (e) { syncState(e.message, 'warn'); }
}

function setAuto(name, on) {
  clearInterval(autoTimers[name]);
  if (on) {
    // One destination at a time. Two automatic syncs would push the same new
    // contacts to both services and pull from both into the same log, racing
    // each other over what counts as already there - and a confirmation
    // arriving from one would be re-uploaded to the other on the next round.
    document.querySelectorAll('[data-auto]').forEach((other) => {
      const who = other.dataset.auto;
      if (who === name || !other.checked) return;
      other.checked = false;
      clearInterval(autoTimers[who]);
      syncState(`auto sync moved to ${name.toUpperCase()}`);
    });
  }
  if (!on) { syncState(''); refreshSync(); return; }
  const round = async () => {
    await pushNew(name, true);
    try { await HD.post(`/api/log/sync/${name}/pull`, {}); } catch { /* reported on the bus */ }
  };
  round();
  autoTimers[name] = setInterval(round, 60000);
}

document.querySelectorAll('[data-push]').forEach((b) => {
  b.onclick = () => pushNew(b.dataset.push);
});
document.querySelectorAll('[data-pull]').forEach((b) => {
  b.onclick = async () => {
    const name = b.dataset.pull;
    syncState(`pulling from ${name.toUpperCase()}…`);
    try {
      // Always deduped: import_adif matches on callsign, date, band, mode and
      // start time, updates the match and adds only what is new. Pulling the
      // same range twice adds nothing the second time.
      await HD.post(`/api/log/sync/${name}/pull`, {});
    } catch (e) { syncState(e.message, 'warn'); }
  };
});
document.querySelectorAll('[data-auto]').forEach((c) => {
  c.onchange = () => setAuto(c.dataset.auto, c.checked);
});

HD.on('log.sync', (p) => {
  if (p.running) { syncState(p.message); return; }
  syncState(p.message, p.ok ? 'good' : 'warn');
  refreshSync();
});
refreshSync();

const DAY = (d) => (d && d.length === 8
  ? new Date(`${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}T00:00:00Z`)
      .toLocaleDateString(undefined,
        { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' })
  : 'undated');

function confOf(r) {
  // What the far end has actually acknowledged, strongest first.
  if ((r.lotw_qsl_rcvd || '').toUpperCase() === 'Y') return ['LoTW', 'yes'];
  if ((r.qsl_rcvd || '').toUpperCase() === 'Y') return ['QSL', 'yes'];
  if ((r.eqsl_qsl_rcvd || '').toUpperCase() === 'Y') return ['eQSL', 'yes'];
  if ((r.lotw_qsl_sent || '').toUpperCase() === 'Y'
      || (r.qsl_sent || '').toUpperCase() === 'Y') return ['sent', 'part'];
  return ['\u2014', ''];
}

// The table is built from this list, so the picker only has to choose which
// entries to walk. A `fixed` column is one the row says nothing without.
const COLUMNS = [
  { key: 'call', label: 'Call', fixed: true, fill: (td, r) => {
      td.className = 'c';
      td.innerHTML = HD.flag(r.iso, r.call) + '<span></span>';
      td.querySelector('span').textContent = r.call;
    } },
  { key: 'time', label: 'Time', mono: true,
    fill: (td, r) => { td.textContent = (r.time_on || '').slice(0, 4); } },
  { key: 'state', label: 'State',
    fill: (td, r) => { td.textContent = r.state || ''; } },
  { key: 'sent', label: 'Sent', mono: true, num: true,
    fill: (td, r) => { td.textContent = r.rst_sent || ''; } },
  { key: 'rcvd', label: 'Rcvd', mono: true, num: true,
    fill: (td, r) => { td.textContent = r.rst_rcvd || ''; } },
  // Frequency is what you were actually on; band is the bucket it falls in.
  { key: 'freq', label: 'Freq', mono: true, num: true, fill: (td, r) => {
      td.textContent = r.freq ? Number(r.freq).toFixed(3) : (r.band || '');
    } },
  { key: 'band', label: 'Band', off: true,
    fill: (td, r) => { td.textContent = r.band || ''; } },
  { key: 'mode', label: 'Mode',
    fill: (td, r) => { td.textContent = r.mode || ''; } },
  { key: 'grid', label: 'Grid', mono: true, off: true,
    fill: (td, r) => { td.textContent = r.gridsquare || ''; } },
  { key: 'dist', label: 'Distance', mono: true, num: true, fill: (td, r) => {
      td.textContent = (r.km === null || r.km === undefined)
        ? '' : HD.fmtDistance(r.km, 0);
    } },
  { key: 'conf', label: 'Conf', fill: (td, r) => {
      const [label, state] = confOf(r);
      td.textContent = label;
      td.className = `conf ${state}`;
    } },
];

let shown = null;                    // Set of visible column keys

function visibleColumns() {
  if (!shown) {
    const saved = (conf.columns || '').trim();
    shown = new Set(saved
      ? saved.split(',').map((x) => x.trim()).filter(Boolean)
      : COLUMNS.filter((c) => !c.off).map((c) => c.key));
  }
  return COLUMNS.filter((c) => c.fixed || shown.has(c.key));
}

function renderColumnPicker() {
  const box = $('#cols');
  box.innerHTML = '';
  COLUMNS.forEach((c) => {
    const label = document.createElement('label');
    const tick = document.createElement('input');
    tick.type = 'checkbox';
    tick.checked = c.fixed || shown.has(c.key);
    tick.disabled = !!c.fixed;       // a row without its callsign says nothing
    tick.onchange = async () => {
      if (tick.checked) shown.add(c.key); else shown.delete(c.key);
      // Kept on the tile: two logbook tiles can show different columns, and
      // the choice travels with the tile.
      conf = { ...conf, columns: [...shown].join(',') };
      try { await HD.saveSettings(conf); } catch { /* still applies now */ }
      refresh();
    };
    label.append(tick, document.createTextNode(' ' + c.label));
    box.appendChild(label);
  });
}

$('#cols-btn').onclick = (e) => {
  e.stopPropagation();
  const box = $('#cols');
  visibleColumns();
  if (box.hidden) renderColumnPicker();
  box.hidden = !box.hidden;
  $('#cols-btn').setAttribute('aria-expanded', String(!box.hidden));
};
document.addEventListener('click', () => { $('#cols').hidden = true; });
$('#cols').addEventListener('click', (e) => e.stopPropagation());

let searchTimer;
$('#q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  // A new search is a new result set, so it starts at the top rather than on
  // whatever page number the last one happened to be showing.
  searchTimer = setTimeout(() => { offset = 0; refresh(); }, 250);
});
$('#q-clear').onclick = () => { $('#q').value = ''; offset = 0; refresh(); };

// ---- paging ---------------------------------------------------------------
let offset = 0;
const pageSize = () => Number($('#page-size').value) || 0;   // 0 means all

$('#page-size').onchange = async () => {
  offset = 0;
  conf = { ...conf, page_size: $('#page-size').value };
  try { await HD.saveSettings(conf); } catch { /* still applies now */ }
  refresh();
};
$('#pg-prev').onclick = () => {
  offset = Math.max(0, offset - (pageSize() || 0));
  refresh();
};
$('#pg-next').onclick = () => { offset += pageSize() || 0; refresh(); };

function drawPager(total) {
  const n = pageSize();
  const bar = $('#pager');
  // Nothing to page through is nothing worth saying.
  if (!n || total <= n) { bar.hidden = true; return; }
  bar.hidden = false;
  const first = total ? offset + 1 : 0;
  const last = Math.min(offset + n, total);
  $('#pg-at').textContent = `${first}\u2013${last} of ${total}`;
  $('#pg-prev').disabled = offset <= 0;
  $('#pg-next').disabled = last >= total;
}

async function refresh() {
  const q = $('#q').value.trim();
  // The host searches and orders the whole log, not whichever page happens to
  // be on screen, and hands back one page plus the total. Sorting here would
  // only sort the page, which quietly drops contacts off the end of it.
  const page = await HD.get('/api/log/page',
    { q, limit: pageSize(), offset });
  // A page that has gone past the end - the last contact on it was deleted,
  // or a search narrowed things - steps back rather than showing nothing.
  if (!page.rows.length && page.total && offset >= page.total) {
    offset = Math.max(0, (Math.ceil(page.total / (pageSize() || page.total)) - 1)
      * (pageSize() || 0));
    return refresh();
  }
  const rows = page.rows;
  drawPager(page.total);

  const cols = visibleColumns();
  const head = document.querySelector('#log-head');
  head.innerHTML = '';
  cols.forEach((c) => {
    const th = document.createElement('th');
    th.textContent = c.label;
    if (c.num) th.className = 'num';
    head.appendChild(th);
  });
  head.appendChild(document.createElement('th'));

  const body = $('#rows');
  body.innerHTML = '';
  let day = null;
  rows.forEach((r) => {
    const d = DAY(r.qso_date);
    if (d !== day) {                 // a date only needs saying when it changes
      day = d;
      const sep = document.createElement('tr');
      sep.className = 'day';
      const td = document.createElement('td');
      td.colSpan = cols.length + 1;
      td.textContent = d;
      sep.appendChild(td);
      body.appendChild(sep);
    }
    const tr = document.createElement('tr');
    cols.forEach((c) => {
      const td = document.createElement('td');
      if (c.mono) td.classList.add('mono');
      if (c.num) td.classList.add('num');
      c.fill(td, r);
      tr.appendChild(td);
    });
    const acts = document.createElement('td');
    acts.className = 'row-acts';
    acts.innerHTML = '<button class="eye" title="All the details">\u25c9</button>'
      + '<button class="del" title="Remove this contact">\u2715</button>';
    acts.querySelector('.eye').onclick = (e) => {
      e.stopPropagation();
      showDetails(r);
    };
    acts.querySelector('.del').onclick = async (e) => {
      e.stopPropagation();           // deleting a row is not selecting it
      await HD.log.remove(r.id);
      refresh();
    };
    tr.appendChild(acts);
    // Clicking a contact makes it the one every other card is looking at.
    tr.onclick = () => select(r, tr);
    tr.title = `Show ${r.call} on the map`;
    body.appendChild(tr);
  });
  if (!rows.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = cols.length + 1;
    td.className = 'day';
    td.textContent = q ? `nothing logged matching "${q}"` : 'nothing logged yet';
    tr.appendChild(td);
    body.appendChild(tr);
  }
}

HD.on('log.qso_added', refresh);
HD.on('radio.state', (s) => {
  if (s.ok && !$('#f-band').value) $('#f-band').value = s.band || '';
  if (s.ok && !$('#f-mode').value) $('#f-mode').value = s.mode || '';
});
(async function boot() {
  try { conf = await HD.settings(); } catch { /* defaults will do */ }
  if (conf.page_size !== undefined && conf.page_size !== '') {
    $('#page-size').value = String(conf.page_size);
  }
  HD.onSettings((v) => {
    conf = v;
    shown = null;
    if (conf.page_size !== undefined && conf.page_size !== '') {
      $('#page-size').value = String(conf.page_size);
    }
    refresh();
  });
  await refresh();
})().catch((e) => { $('#err').textContent = e.message; });
</script>
</body>
</html>
